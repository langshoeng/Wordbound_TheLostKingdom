<style>
:root{--bg:#0b1d2e;--bg2:#12405a;--card:#14364b;--line:#2b5f76;--ink:#eef3f1;--mut:#a3bec2;--gold:#f2b84b;--teal:#3fc1b0;--bad:#ff9b8c;color-scheme:dark;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}

.gd{font-weight:800;color:var(--gold);white-space:nowrap}
nav{display:flex;gap:6px;margin-bottom:14px}nav button{flex:1;padding:10px 4px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font:600 .95rem Figtree,sans-serif;cursor:pointer}

button:focus-visible{outline:3px solid #fff;outline-offset:2px}

<script>
const B=[
{id:'gate',t:'The Village Gate',ic:'🚪',d:'easy',min:3,sk:'Finding details',v:[],
p:`<b>WELCOME TO ASHFORD</b><br>The gate opens at 7 a.m. and closes at 6 p.m. Visitors must sign the book at the gate. Horses stay outside the walls. The market is open on Tuesdays and Fridays. Lost something? Ask Mr. Ben at the well.`,
qs:[{q:`When does the gate close?`,c:[`7 a.m.`,`6 p.m.`,`Tuesday`,`Friday`],a:1,ev:`closes at 6 p.m.`,e:`The notice says the gate closes at 6 p.m. The time 7 a.m. is when it opens.`},
{q:`What must visitors do?`,c:[`Leave their horses inside`,`Sign the book`,`Ask Mr. Ben`,`Pay gold`],a:1,ev:`must sign the book`,e:`Visitors must sign the book at the gate. Horses stay outside, and Mr. Ben helps only with lost things.`},
{q:`Where can you ask about a lost thing?`,c:[`At the market`,`At the gate`,`At the well`,`At the walls`],a:2,ev:`Ask Mr. Ben at the well.`,e:`The notice sends people with lost things to Mr. Ben at the well.`}]},
{id:'baker',t:`The Baker’s Note`,ic:'🍞',d:'easy',min:3,sk:'Practical reading',v:[],
p:`Tom,<br>I am at the market until noon. Please do this: first, put the bread in the oven at nine. Then, take it out after thirty minutes. Do not open the shop before ten. If Mrs. Pike comes, give her the small loaf. She has paid already.<br>– Rosa`,
qs:[{q:`What should Tom do first?`,c:[`Open the shop`,`Put the bread in the oven`,`Take out the bread`,`Go to the market`],a:1,ev:`first, put the bread in the oven at nine`,e:`Rosa writes “first” before the oven step, so that is the first job.`},
{q:`When can Tom open the shop?`,c:[`Before nine`,`At ten or later`,`At noon only`,`After thirty minutes`],a:1,ev:`Do not open the shop before ten.`,e:`“Not before ten” means ten o’clock or later is allowed.`},
{q:`Does Mrs. Pike need to pay?`,c:[`Yes, with gold`,`Yes, at noon`,`No, she already paid`,`We cannot know`],a:2,ev:`She has paid already.`,e:`“Has paid already” means the payment is finished.`}]},
{id:'package',t:'The Missing Package',ic:'📦',d:'easy',min:3,sk:'Inference',v:[['collected','took something away']],
p:`Lina left a package at the front desk at 8:15 a.m. When she returned at noon, the receptionist said a delivery driver had collected it at 10:30 a.m. Lina had not arranged a delivery. The security log showed that the driver used an identification card belonging to another person.`,
qs:[{q:`What time did the driver collect the package?`,c:[`8:15 a.m.`,`10:30 a.m.`,`Noon`,`We cannot know`],a:1,ev:`collected it at 10:30 a.m.`,e:`8:15 is when Lina left it, and noon is when she came back. The driver came at 10:30.`},
{q:`What can Lina reasonably conclude?`,c:[`The receptionist delivered the package herself.`,`Someone may have collected the package using false identification.`,`Lina forgot to arrange a delivery.`,`The delivery driver arrived after noon.`],a:1,ev:`identification card belonging to another person`,e:`The log says the driver used another person’s ID card, so the collection may have been unauthorized. The passage does not prove who took the package.`},
{q:`In the passage, “collected” means…`,c:[`took away`,`cleaned`,`counted`,`painted`],a:0,s:'Vocabulary in context',ev:`had collected it`,e:`The driver came and took the package away, so “collected” means took away.`}]},
{id:'market',t:'Market Day',ic:'🍎',d:'medium',min:4,sk:'Vocabulary in context',v:[['exhausted','very tired'],['bargain','a good price']],
p:`The market was crowded and noisy. Mira was exhausted after walking all morning, so she sat on a barrel to rest. A merchant offered her a bargain: two apples for the price of one. “Take them,” he said. “They are fresh. I picked them an hour ago.” Mira smiled. She had very little money, so the cheap price made her happy.`,
qs:[{q:`“Exhausted” means…`,c:[`very tired`,`very hungry`,`very angry`,`very rich`],a:0,ev:`exhausted after walking all morning, so she sat on a barrel to rest`,e:`She walked all morning and then sat down to rest, so she was very tired.`},
{q:`“Bargain” means…`,c:[`a lie`,`a good price`,`a gift from a friend`,`a heavy bag`],a:1,ev:`two apples for the price of one`,e:`Two apples for the price of one is a good price, which is what a bargain is.`},
{q:`Why was Mira happy?`,c:[`The apples were free.`,`She had a lot of money.`,`The price was low and she had little money.`,`The merchant was her friend.`],a:2,s:'Inference',ev:`very little money, so the cheap price made her happy`,e:`The text says she had very little money and the cheap price made her happy. The apples were cheap, not free.`}]},
{id:'well',t:`The Well Rules`,ic:'💧',d:'easy',min:3,sk:'Finding details',v:[],p:`Mr. Ben looks after the village well. Water is free for everyone, but each person may take only two buckets a day. The well is closed on Sundays for cleaning. Children must not go near the well without an adult. If the rope is broken, tell Mr. Ben.`,qs:[{q:`How many buckets may each person take in a day?`,c:[`One`,`Two`,`Three`,`As many as they want`],a:1,ev:`only two buckets a day`,e:`The text says each person may take only two buckets a day.`},{q:`When is the well closed?`,c:[`Mondays`,`Fridays`,`Sundays`,`At night`],a:2,ev:`closed on Sundays for cleaning`,e:`The well is closed on Sundays for cleaning.`},{q:`What should you do if the rope is broken?`,c:[`Fix it yourself`,`Tell Mr. Ben`,`Close the well`,`Ask a child`],a:1,ev:`tell Mr. Ben`,e:`The last sentence says to tell Mr. Ben.`}]},{id:'inn',t:`The Inn Menu`,ic:'🍲',d:'easy',min:3,sk:'Practical reading',v:[],p:`<b>THE GREEN DOOR INN</b><br>Breakfast: bread and eggs, 5 coins (7–10 a.m.)<br>Lunch: vegetable soup, 8 coins (12–2 p.m.)<br>Dinner: fish and rice, 12 coins (6–9 p.m.)<br>A room for one night costs 20 coins. Breakfast is free if you stay the night.`,qs:[{q:`How much is the soup?`,c:[`5 coins`,`8 coins`,`12 coins`,`20 coins`],a:1,ev:`vegetable soup, 8 coins`,e:`The lunch line says vegetable soup costs 8 coins.`},{q:`When can you eat fish and rice?`,c:[`7–10 a.m.`,`12–2 p.m.`,`6–9 p.m.`,`All day`],a:2,ev:`fish and rice, 12 coins (6–9 p.m.)`,e:`Fish and rice is the dinner meal, served from 6 to 9 p.m.`},{q:`Ana stays one night and eats breakfast. How much does she pay in total?`,c:[`20 coins`,`25 coins`,`5 coins`,`32 coins`],a:0,ev:`Breakfast is free if you stay the night.`,e:`The room costs 20 coins, and breakfast is free for guests who stay the night.`}]},{id:'cart',t:`The Cart Road`,ic:'🛒',d:'easy',min:3,sk:'Sequencing events',v:[],p:`Pip walked to the river first. After that, she crossed the old bridge. Then she stopped at the farm to buy milk. Finally, she carried the milk home before it became dark.`,qs:[{q:`Where did Pip go first?`,c:[`The farm`,`The bridge`,`The river`,`Home`],a:2,ev:`walked to the river first`,e:`The word “first” shows the river was her first stop.`},{q:`What did Pip do after she crossed the bridge?`,c:[`Bought milk at the farm`,`Went home`,`Walked to the river`,`Waited until dark`],a:0,ev:`she stopped at the farm to buy milk`,e:`“Then” tells us the farm came after the bridge.`},{q:`When did Pip get home?`,c:[`Before dark`,`After dark`,`At noon`,`Before the river`],a:0,ev:`before it became dark`,e:`She carried the milk home before it became dark.`}]},{id:'mayor',t:`A Letter from the Mayor`,ic:'✉️',d:'medium',min:4,sk:'Main idea',v:[['patience','waiting calmly']],p:`Dear villagers,<br>Many of you have asked about the broken bridge. I am happy to say that workers will start repairing it on Monday. The work will take two weeks. During this time, please use the north road, even though it is longer. Thank you for your patience.<br>Mayor Hale`,qs:[{q:`What is the main purpose of the letter?`,c:[`To ask for money`,`To explain plans to repair the bridge`,`To close the north road`,`To welcome visitors`],a:1,ev:`workers will start repairing it on Monday`,e:`The letter answers questions about the broken bridge and tells people when the repair starts.`},{q:`How long will the repair take?`,c:[`One week`,`Two weeks`,`Two months`,`One day`],a:1,s:'Finding details',ev:`The work will take two weeks.`,e:`The work will take two weeks.`},{q:`“Patience” means…`,c:[`being able to wait calmly`,`being very fast`,`being angry`,`being rich`],a:0,s:'Vocabulary in context',ev:`Thank you for your patience.`,e:`People must use a longer road for two weeks. The mayor thanks them for waiting calmly.`}]},{id:'smith',t:`The Blacksmith’s Rule`,ic:'⚒️',d:'medium',min:4,sk:'Dialogue comprehension',v:[],p:`<b>Kai:</b> Can you make a sword by Friday?<br><b>Smith:</b> I can try, but it is not easy. Good iron takes time.<br><b>Kai:</b> I will pay double.<br><b>Smith:</b> It is not about money. I will not rush my work. Come on Monday.`,qs:[{q:`What does the smith mean by “I can try”?`,c:[`He is sure he can finish`,`He is not sure he can finish in time`,`He will not make the sword`,`He wants more money`],a:1,ev:`I can try, but it is not easy`,e:`“I can try, but it is not easy” means he is not promising to finish by Friday.`},{q:`Why does the smith not hurry, even for double pay?`,c:[`He is lazy`,`He is angry with Kai`,`He wants to make the sword well`,`He has no iron`],a:2,s:'Inference',ev:`It is not about money. I will not rush my work.`,e:`He says it is not about money and that good iron takes time, so quality matters to him.`},{q:`When does the smith want Kai to come?`,c:[`Friday`,`Monday`,`Tuesday`,`Today`],a:1,s:'Finding details',ev:`Come on Monday.`,e:`The smith ends with “Come on Monday.”`}]},{id:'witness',t:`Two Witnesses`,ic:'🔍',d:'medium',min:4,sk:'Detective clues',v:[],p:`<b>Anna:</b> I saw the thief run past the bakery at seven. He wore a red hat.<br><b>Ben:</b> At seven I was in the bakery. I did not see anyone run past. But I heard the church bell ring at half past seven, and then a dog barked.`,qs:[{q:`What do the two witnesses disagree about?`,c:[`The colour of the hat`,`Whether someone ran past the bakery at seven`,`The time of the church bell`,`The name of the dog`],a:1,ev:`I did not see anyone run past`,e:`Anna says she saw the thief run past. Ben says he did not see anyone.`},{q:`What might explain why Ben did not see the thief?`,c:[`Ben is definitely lying`,`Ben was inside and may not have been looking outside`,`The thief was invisible`,`Anna was in the bakery`],a:1,s:'Inference',ev:`At seven I was in the bakery.`,e:`Ben was inside the bakery. That may explain it, but it does not prove who is right.`},{q:`Which statement is true according to the text?`,c:[`Anna heard the church bell`,`Ben heard the church bell`,`Anna was in the bakery`,`Ben saw the red hat`],a:1,s:'Finding details',ev:`I heard the church bell ring at half past seven`,e:`Ben is the one who says he heard the church bell.`}]},{id:'storm',t:`The Storm Warning`,ic:'⛈️',d:'medium',min:4,sk:'Practical reading',v:[],p:`<b>NOTICE:</b> Strong winds are expected tonight. All boats must be tied to the dock by 5 p.m. Shop owners should close their windows. If the bell rings three times, go to the stone hall. Do not walk near the river. School will be closed tomorrow.`,qs:[{q:`What should people do if the bell rings three times?`,c:[`Go to the stone hall`,`Tie the boats`,`Close the windows`,`Walk to the river`],a:0,ev:`If the bell rings three times, go to the stone hall`,e:`The notice gives this instruction for three bells.`},{q:`Who should close their windows?`,c:[`Boat owners`,`Shop owners`,`Children`,`The bell ringer`],a:1,ev:`Shop owners should close their windows`,e:`The notice says shop owners should close their windows.`},{q:`Why must the boats be tied to the dock?`,c:[`Strong winds could move them`,`The dock is closing`,`The boats are too heavy`,`There is a festival`],a:0,s:'Inference',ev:`Strong winds are expected tonight`,e:`The notice does not say why directly, but strong winds are expected, and wind could move loose boats.`}]},{id:'trader',t:`The Trader’s Claim`,ic:'🧭',d:'medium',min:4,sk:'Vocabulary in context',v:[['doubtful','not sure something is true']],p:`A trader came to Ashford and claimed he had walked from the coast in two days. People were doubtful, because the coast is more than a week away on foot. Then they noticed his boots. They were clean and new, and he was not even tired.`,qs:[{q:`“Doubtful” means…`,c:[`not sure it is true`,`very pleased`,`very hungry`,`afraid`],a:0,ev:`People were doubtful, because the coast is more than a week away on foot`,e:`People did not believe the two-day claim, so they were not sure it was true.`},{q:`Why did the people doubt the trader?`,c:[`He was rude`,`The coast is too far for a two-day walk`,`He had no boots`,`He was tired`],a:1,s:'Finding details',ev:`the coast is more than a week away on foot`,e:`The coast is more than a week away on foot, which does not fit a two-day walk.`},{q:`What do his boots suggest?`,c:[`He walked a very long way`,`He may not have walked far`,`He is very poor`,`He is a farmer`],a:1,s:'Inference',ev:`They were clean and new, and he was not even tired.`,e:`Clean boots and no tiredness suggest he did not walk far. This is a clue, not proof.`}]},{id:'herb',t:`The Herb Garden`,ic:'🌿',d:'medium',min:4,sk:'Comparing texts',v:[],p:`<b>Note from Dr. Mara:</b> Mint helps with a sore stomach. Drink it as tea, once in the evening.<br><b>Note from Old Tess:</b> Mint is good for a sore stomach too, but I say drink it twice a day, in the morning and at night.`,qs:[{q:`What do both notes say?`,c:[`Mint helps with a sore stomach`,`Mint should be eaten raw`,`Mint should be drunk once a day`,`Mint is dangerous`],a:0,ev:`Mint helps with a sore stomach`,e:`Both writers say mint is good for a sore stomach.`},{q:`How do the notes differ?`,c:[`How often to drink the tea`,`What mint tastes like`,`Where mint grows`,`How much mint costs`],a:0,ev:`drink it twice a day`,e:`Dr. Mara says once in the evening. Old Tess says twice a day.`},{q:`How often does Dr. Mara say to drink mint tea?`,c:[`Once in the evening`,`Twice a day`,`Every morning`,`Three times a day`],a:0,s:'Finding details',ev:`once in the evening`,e:`Dr. Mara says once in the evening.`}]},{id:'journal',t:`The Brother’s Journal`,ic:'✍️',d:'hard',min:5,sk:'Integrated comprehension',v:[],p:`<b>Journal page:</b> My brother and I left the village at dawn. We followed the river north until the water turned red from the clay hills. There the path splits. He chose the left path because it looked easier. I stayed behind to guard the horses. By evening he had not returned, so I lit a fire on the hill.<br><br><b>Guard report:</b> A fire was seen on the western hill at night. It was gone by morning.`,qs:[{q:`Where does the path split?`,c:[`At the village`,`Where the river water turns red`,`On the western hill`,`At the bridge`],a:1,s:'Finding details',ev:`the water turned red from the clay hills`,e:`The writer says the path splits where the water turns red near the clay hills.`},{q:`Why did the writer light a fire?`,c:[`To cook dinner`,`To signal to his brother`,`To warm the horses`,`To scare the guard`],a:1,s:'Inference',ev:`he had not returned, so I lit a fire on the hill`,e:`The brother had not come back, so the fire was probably a signal. The writer does not say this directly.`},{q:`How do the two texts fit together?`,c:[`The guard probably saw the writer’s fire`,`The guard is the writer’s brother`,`The fire was in the village`,`The fire burned until morning`],a:0,ev:`A fire was seen on the western hill at night.`,e:`Both texts mention a fire on a hill at night. The guard report is likely about the writer’s fire, though the texts do not prove it.`}]},{id:'bell',t:`The Bell Tower`,ic:'🔔',d:'easy',min:3,sk:'Finding details',v:[],p:`The bell in Ashford tower rings at six o’clock every morning. It rings once at noon and twice at six in the evening. On feast days it rings ten times. Old Maren pulls the rope because the tower door is too small for most people.`,qs:[{q:`How many times does the bell ring at six in the evening?`,c:[`Once`,`Twice`,`Ten times`,`Never`],a:1,ev:`twice at six in the evening`,e:`The text says the bell rings twice at six in the evening.`},{q:`When does the bell ring ten times?`,c:[`Every morning`,`At noon`,`On feast days`,`On Sundays`],a:2,ev:`On feast days it rings ten times.`,e:`Ten rings happen only on feast days.`},{q:`Who pulls the rope?`,c:[`Mr. Ben`,`Old Maren`,`Mayor Hale`,`Tom`],a:1,ev:`Old Maren pulls the rope`,e:`The text names Old Maren as the person who pulls the rope.`}]},{id:'rumour',t:`The Rumour`,ic:'🗣️',d:'medium',min:4,sk:'Dialogue comprehension',v:[['rumour','news that may not be true']],p:`<b>Lena:</b> Did you hear? The baker is leaving Ashford.<br><b>Omar:</b> Who told you that?<br><b>Lena:</b> Well, Pia said that Jon said it, but I am not sure it is true.<br><b>Omar:</b> Then let us ask the baker before we tell anyone else.`,qs:[{q:`Why does Omar ask “Who told you that?”`,c:[`He wants to know where the news came from`,`He is angry with the baker`,`He did not hear Lena`,`He wants to leave Ashford`],a:0,ev:`Who told you that?`,e:`Omar wants to know the source of the news before he believes it.`},{q:`How sure is Lena that the news is true?`,c:[`Completely sure`,`Not sure`,`She saw it herself`,`She heard it from the baker`],a:1,s:'Finding details',ev:`I am not sure it is true`,e:`Lena says herself that she is not sure it is true.`},{q:`What can we conclude about the news?`,c:[`It is confirmed`,`It is only a rumour so far`,`The baker told Lena`,`Omar started it`],a:1,s:'Inference',ev:`Pia said that Jon said it`,e:`The news passed from Jon to Pia to Lena, and nobody has checked it. Omar wants to ask the baker.`}]},{id:'soup',t:`Granny’s Soup`,ic:'🥣',d:'medium',min:4,sk:'Sequencing events',v:[],p:`First, wash and chop two carrots and one onion. Next, heat oil in a pot and cook the onion for five minutes. Add the carrots and three cups of water. Let the soup cook for twenty minutes. Before serving, add salt. Do not add the salt earlier, or the carrots will stay hard.`,qs:[{q:`What do you do right after cooking the onion?`,c:[`Add salt`,`Add the carrots and water`,`Wash the carrots`,`Serve the soup`],a:1,ev:`Add the carrots and three cups of water.`,e:`After the onion cooks for five minutes, the next step is to add the carrots and water.`},{q:`When should you add salt?`,c:[`At the start`,`Before serving`,`With the onion`,`After eating`],a:1,s:'Finding details',ev:`Before serving, add salt.`,e:`The recipe says to add salt before serving.`},{q:`Why should you not add salt earlier?`,c:[`The soup would be too hot`,`The carrots would stay hard`,`The onion would burn`,`The water would disappear`],a:1,s:'Finding details',ev:`the carrots will stay hard`,e:`The recipe says early salt makes the carrots stay hard.`}]},{id:'ledger',t:`The Merchant’s Ledger`,ic:'📒',d:'medium',min:4,sk:'Practical reading',v:[],p:`<b>MONDAY:</b> sold 12 apples at 2 coins each; bought a sack of flour for 15 coins.<br><b>TUESDAY:</b> sold 8 loaves at 3 coins each; paid 5 coins for a new basket.<br><b>WEDNESDAY:</b> market closed because of rain.`,qs:[{q:`How many coins did the merchant earn from apples on Monday?`,c:[`12`,`24`,`2`,`15`],a:1,ev:`sold 12 apples at 2 coins each`,e:`12 apples at 2 coins each is 24 coins. The 15 coins were spent on flour.`},{q:`What happened on Wednesday?`,c:[`He sold bread`,`The market was closed because of rain`,`He bought a basket`,`He sold apples`],a:1,ev:`market closed because of rain`,e:`The ledger says the market was closed because of rain.`},{q:`On which day did he pay for a basket?`,c:[`Monday`,`Tuesday`,`Wednesday`,`Never`],a:1,ev:`paid 5 coins for a new basket`,e:`The basket payment is written under Tuesday.`}]},{id:'bakers',t:`The Rival Bakers`,ic:'🥖',d:'hard',min:5,sk:'Integrated comprehension',v:[],p:`<b>Rosa:</b> My rival, Hugo, sells old bread. Last week he sold me a loaf that was already hard.<br><b>Hugo:</b> That is not true. Rosa has never bought bread from me. She only says this because my shop is busier than hers.<br><b>Customer note:</b> I buy bread from both shops. Hugo’s bread is always fresh, but his prices are higher than Rosa’s.`,qs:[{q:`What do Rosa and Hugo disagree about?`,c:[`The price of bread`,`Whether Rosa bought a hard loaf from Hugo`,`Which shop is bigger`,`Where the customer lives`],a:1,s:'Finding details',ev:`Rosa has never bought bread from me`,e:`Rosa says Hugo sold her a hard loaf. Hugo says she has never bought bread from him.`},{q:`What does the customer note support?`,c:[`Rosa’s claim`,`Hugo’s claim that his bread is not old`,`That both shops are closed`,`That Rosa’s prices are higher`],a:1,s:'Inference',ev:`Hugo’s bread is always fresh`,e:`The customer says Hugo’s bread is always fresh. That supports Hugo, but it does not prove what happened last week.`},{q:`According to Hugo, why does Rosa say this?`,c:[`His shop is busier than hers`,`His bread is expensive`,`She is hungry`,`The customer asked her to`],a:0,s:'Finding details',ev:`my shop is busier than hers`,e:`Hugo says Rosa speaks this way because his shop is busier.`}]},{id:'door',t:'The Locked Library Door',ic:'🗝️',d:'hard',min:5,sk:'Integrated comprehension',v:[['dawn','the first light of the morning']],
