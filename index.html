STB.push(...[{"id":"dist-1","l":4,"k":"dist","kn":"Exam distinctions","o":1,"t":"Distinctions · Set 1","ic":"⚖️","w":[["Linguistics vs. Applied Linguistics","Linguistics studies language systematically; Applied Linguistics applies language knowledge to real-world language problems, especially teaching and learning."],["Semantics vs. Pragmatics","Semantics concerns meaning encoded in language; pragmatics concerns meaning interpreted in context."],["Cohesion vs. Coherence","Cohesion is the linguistic linking of text; coherence is the overall logical and meaningful connection of ideas."],["Approach vs. Method vs. Technique","Approach = beliefs; Method = organized teaching plan; Technique = specific classroom procedure."],["Acquisition vs. Learning","Acquisition emphasizes natural development through meaningful exposure/use; learning emphasizes conscious study or knowledge."],["Competence vs. Performance","Competence is underlying knowledge; performance is actual language use."]],"g":[["Linguistics studies language systematically; ___ applies language knowledge to real-world problems, especially teaching and learning.","Applied Linguistics","Linguistics","Sociolinguistics","<b>Linguistics vs. Applied Linguistics</b><br>Linguistics studies language systematically; Applied Linguistics applies language knowledge to real-world language problems, especially teaching and learning."],["Semantics concerns meaning encoded in language; ___ concerns meaning interpreted in context.","Pragmatics","Semantics","Syntax","<b>Semantics vs. Pragmatics</b><br>Semantics concerns meaning encoded in language; pragmatics concerns meaning interpreted in context."],["Cohesion is the linguistic linking of text; ___ is the overall logical and meaningful connection of ideas.","Coherence","Cohesion","Inference","<b>Cohesion vs. Coherence</b><br>Cohesion is the linguistic linking of text; coherence is the overall logical and meaningful connection of ideas."],["A ___ is a specific classroom procedure, while a method is an organized teaching plan and an approach is a set of beliefs.","Technique","Approach","Method","<b>Approach vs. Method vs. Technique</b><br>Approach = beliefs; Method = organized teaching plan; Technique = specific classroom procedure."],["___ emphasizes natural development through meaningful exposure and use, while learning emphasizes conscious study.","Acquisition","Learning","Transfer","<b>Acquisition vs. Learning</b><br>Acquisition emphasizes natural development through meaningful exposure/use; learning emphasizes conscious study or knowledge."],["Competence is underlying knowledge; ___ is actual language use.","Performance","Competence","Fluency","<b>Competence vs. Performance</b><br>Competence is underlying knowledge; performance is actual language use."]],"c":null},{"id":"dist-2","l":4,"k":"dist","kn":"Exam distinctions","o":1,"t":"Distinctions · Set 2","ic":"⚖️","w":[["Synonymy vs. Hyponymy","Synonymy concerns similar meanings; hyponymy concerns a category/member relationship."],["Homonymy vs. Polysemy","Homonymy involves identical forms with unrelated meanings; polysemy involves multiple related meanings."],["Phonetics vs. Phonology","Phonetics studies physical speech sounds; phonology studies how sounds function in a language system."],["Phoneme vs. Morpheme","A phoneme is a smallest contrastive sound unit; a morpheme is a smallest meaningful or grammatical unit."],["Descriptive vs. Prescriptive Grammar","Descriptive grammar describes actual use; prescriptive grammar states preferred or standard rules."],["Form vs. Function","Form is the grammatical shape; function is the communicative purpose."]],"g":[["Synonymy concerns similar meanings; ___ concerns a category and member relationship.","Hyponymy","Synonymy","Antonymy","<b>Synonymy vs. Hyponymy</b><br>Synonymy concerns similar meanings; hyponymy concerns a category/member relationship."],["Homonymy involves identical forms with unrelated meanings; ___ involves multiple related meanings.","Polysemy","Homonymy","Metonymy","<b>Homonymy vs. Polysemy</b><br>Homonymy involves identical forms with unrelated meanings; polysemy involves multiple related meanings."],["Phonetics studies physical speech sounds; ___ studies how sounds function in a language system.","Phonology","Phonetics","Morphology","<b>Phonetics vs. Phonology</b><br>Phonetics studies physical speech sounds; phonology studies how sounds function in a language system."],["A phoneme is a smallest contrastive sound unit; a ___ is a smallest meaningful or grammatical unit.","morpheme","phoneme","syllable","<b>Phoneme vs. Morpheme</b><br>A phoneme is a smallest contrastive sound unit; a morpheme is a smallest meaningful or grammatical unit."],["___ grammar describes actual use, while prescriptive grammar states preferred or standard rules.","Descriptive","Prescriptive","Functional","<b>Descriptive vs. Prescriptive Grammar</b><br>Descriptive grammar describes actual use; prescriptive grammar states preferred or standard rules."],["Form is the grammatical shape; ___ is the communicative purpose.","function","form","register","<b>Form vs. Function</b><br>Form is the grammatical shape; function is the communicative purpose."]],"c":null},{"id":"dist-3","l":4,"k":"dist","kn":"Exam distinctions","o":1,"t":"Distinctions · Set 3","ic":"⚖️","w":[["Input vs. Output","Input is language received; output is language produced."],["Positive vs. Negative Transfer","Positive transfer helps learning; negative transfer contributes to errors."],["Direct vs. Indirect Speech Act","Direct speech acts match grammatical form and function; indirect speech acts do not."],["Positive vs. Negative Face","Positive face is the desire for approval; negative face is the desire for freedom from imposition."],["Equality vs. Equity","Equality gives the same treatment/opportunity; equity provides fair support according to different needs."],["Assessment vs. Evaluation","Assessment gathers evidence about learning/performance; evaluation makes judgments about quality, value, or effectiveness."]],"g":[["Input is language received; ___ is language produced.","Output","Input","Uptake","<b>Input vs. Output</b><br>Input is language received; output is language produced."],["Positive transfer helps learning; ___ transfer contributes to errors.","negative","positive","zero","<b>Positive vs. Negative Transfer</b><br>Positive transfer helps learning; negative transfer contributes to errors."],["Direct speech acts match grammatical form and function; ___ speech acts do not.","indirect","direct","formal","<b>Direct vs. Indirect Speech Act</b><br>Direct speech acts match grammatical form and function; indirect speech acts do not."],["Positive face is the desire for approval; ___ face is the desire for freedom from imposition.","negative","positive","public","<b>Positive vs. Negative Face</b><br>Positive face is the desire for approval; negative face is the desire for freedom from imposition."],["Equality gives the same treatment and opportunity; ___ provides fair support according to different needs.","Equity","Equality","Accessibility","<b>Equality vs. Equity</b><br>Equality gives the same treatment/opportunity; equity provides fair support according to different needs."],["Assessment gathers evidence about learning; ___ makes judgments about quality or value.","Evaluation","Assessment","Validity","<b>Assessment vs. Evaluation</b><br>Assessment gathers evidence about learning/performance; evaluation makes judgments about quality, value, or effectiveness."]],"c":null},{"id":"case-1","l":5,"k":"cases","kn":"Classroom cases","o":1,"t":"Case: Methods in Action","ic":"🎬","w":[["Audio-Lingual Method","A method emphasizing listening and speaking practice, repetition, drills, habit formation, and controlled patterns."],["Grammar-Translation Method","A method emphasizing grammar rules, translation, reading, and written exercises, with less emphasis on spontaneous speaking."],["Direct Method","A method that teaches the target language directly, emphasizes speaking and listening, and generally avoids translation."],["Task-Based Language Teaching","An approach in which learners use language to complete meaningful tasks, with communication central to the lesson."],["PPP","A lesson model with three stages: Presentation, Practice, Production."],["Total Physical Response","A method linking language with physical movement, especially useful for beginning learners."]],"g":[["Learners memorise dialogues and practise pattern drills until their responses become automatic habits. This is ___.","Audio-Lingual Method","Direct Method","Natural Approach","<b>Audio-Lingual Method</b>: A method emphasizing listening and speaking practice, repetition, drills, habit formation, and controlled patterns.<br><i>Example: Students repeat and substitute words in a sentence pattern.</i>"],["Learners translate texts between their first language and English and study grammar rules in detail, with little speaking. This is ___.","Grammar-Translation Method","Direct Method","Audio-Lingual Method","<b>Grammar-Translation Method</b>: A method emphasizing grammar rules, translation, reading, and written exercises, with less emphasis on spontaneous speaking.<br><i>Example: Students translate sentences between English and Khmer.</i>"],["The teacher uses only English, shows meaning with objects and actions, and never translates. This is ___.","Direct Method","Grammar-Translation Method","Silent Way","<b>Direct Method</b>: A method that teaches the target language directly, emphasizes speaking and listening, and generally avoids translation.<br><i>Example: The teacher explains a new word using objects or pictures rather than Khmer.</i>"],["Learners plan a trip together, and the language they need arises from completing that real-world task. This is ___.","Task-Based Language Teaching","Grammar-Translation Method","Audio-Lingual Method","<b>Task-Based Language Teaching</b>: An approach in which learners use language to complete meaningful tasks, with communication central to the lesson.<br><i>Example: Students plan a trip using English and then present their plan.</i>"],["The teacher presents a new structure, learners do controlled exercises, then use it freely in a speaking activity. This lesson shape is ___.","PPP","Task-Based Language Teaching","Direct Method","<b>PPP</b>: A lesson model with three stages: Presentation, Practice, Production.<br><i>Example: Teach 'used to' with pictures, drill it, then students write about childhood habits.</i>"],["At first learners only respond to commands such as 'stand up' with actions, without speaking. This is ___.","Total Physical Response","Silent Way","Suggestopedia","<b>Total Physical Response</b>: A method linking language with physical movement, especially useful for beginning learners.<br><i>Example: The teacher says 'Stand up' and students perform the action.</i>"]],"c":null},{"id":"case-2","l":5,"k":"cases","kn":"Classroom cases","o":1,"t":"Case: Approaches and Techniques","ic":"🧭","w":[["Blended Learning","Learning that combines face-to-face instruction with online or digital learning."],["Differentiated Instruction","Adapting teaching, tasks, materials, or assessment to learners' different needs and levels."],["Teacher-Centered Learning","An approach in which the teacher controls much of the content, explanation, pace, and classroom activity."],["Inquiry-Based Learning","Learning through asking questions, investigating evidence, and developing explanations."],["Problem-Based Learning","Learning organized around investigating and solving a meaningful problem."],["Reflective Learning","Learning that involves examining one's own experience, decisions, and progress."]],"g":[["A course combines online self-study activities with face-to-face lessons. This is ___.","Blended Learning","Collaborative Learning","Eclectic Approach","<b>Blended Learning</b>: Learning that combines face-to-face instruction with online or digital learning.<br><i>Example: Students learn in class and complete an online activity.</i>"],["The teacher gives different tasks to different learners according to readiness, interests and learning profiles. This is ___.","Differentiated Instruction","Blended Learning","Teacher-Centered Learning","<b>Differentiated Instruction</b>: Adapting teaching, tasks, materials, or assessment to learners' different needs and levels.<br><i>Example: A teacher provides easier and more challenging reading tasks.</i>"],["The teacher controls the lesson, explains everything and learners mostly listen. This is ___.","Teacher-Centered Learning","Student-Centered Learning","Inquiry-Based Learning","<b>Teacher-Centered Learning</b>: An approach in which the teacher controls much of the content, explanation, pace, and classroom activity.<br><i>Example: The teacher lectures while students mainly listen and take notes.</i>"],["Learners pose questions, investigate sources and build their own understanding. This is ___.","Inquiry-Based Learning","Teacher-Centered Learning","Grammar-Translation Method","<b>Inquiry-Based Learning</b>: Learning through asking questions, investigating evidence, and developing explanations.<br><i>Example: Students investigate why plants grow differently in two places.</i>"],["Learners work on an authentic real-life problem that is presented at the start of the unit. This is ___.","Problem-Based Learning","Project-Based Learning","Audio-Lingual Method","<b>Problem-Based Learning</b>: Learning organized around investigating and solving a meaningful problem.<br><i>Example: Students identify causes of poor attendance and propose solutions.</i>"],["At the end of the lesson the teacher asks learners to think about what worked and what to change next time. This is ___.","Reflective Learning","Experiential Learning","Andragogy","<b>Reflective Learning</b>: Learning that involves examining one's own experience, decisions, and progress.<br><i>Example: A student reflects on why a speaking task was difficult.</i>"]],"c":null},{"id":"case-3","l":5,"k":"cases","kn":"Classroom cases","o":1,"t":"Case: Classroom Moves","ic":"🗣️","w":[["Concept Checking","Asking short questions to check that learners understand the meaning of new language."],["Corrective Feedback","Information provided to a learner about the accuracy or appropriateness of their language."],["Wait Time","The deliberate pause a teacher gives after asking a question before selecting a response."],["Peer Feedback","Feedback provided by one learner to another."],["Elicitation","A teaching technique used to encourage learners to produce information or language rather than simply receive it."],["Mixed-Ability Class","A class containing learners with different levels of ability or proficiency."]],"g":[["To check that learners understand 'yesterday', the teacher asks 'Is it past or present?'. This technique is ___.","Concept Checking","Elicitation","Open-Ended Question","<b>Concept Checking</b>: Asking short questions to check that learners understand the meaning of new language.<br><i>Example: 'Is it happening now?' to check the present continuous.</i>"],["A learner says 'He go to school.' and the teacher replies 'He goes to school.' This is ___.","Corrective Feedback","Peer Feedback","Wait Time","<b>Corrective Feedback</b>: Information provided to a learner about the accuracy or appropriateness of their language.<br><i>Example: Teacher: 'He go?' Student: 'He goes.'</i>"],["After asking a question, the teacher stays silent for several seconds before choosing a student. This is ___.","Wait Time","Elicitation","Questioning","<b>Wait Time</b>: The deliberate pause a teacher gives after asking a question before selecting a response.<br><i>Example: The teacher waits five seconds so more students can think.</i>"],["Learners swap drafts and comment on each other's paragraphs using a checklist. This is ___.","Peer Feedback","Teacher Talk","Self-Assessment","<b>Peer Feedback</b>: Feedback provided by one learner to another.<br><i>Example: Students exchange essays and give suggestions.</i>"],["Instead of giving the word, the teacher draws it out of the learners with clues and prompts. This is ___.","Elicitation","Modeling","Closed Question","<b>Elicitation</b>: A teaching technique used to encourage learners to produce information or language rather than simply receive it.<br><i>Example: The teacher shows a picture and asks, 'What is this?'</i>"],["A class includes learners of very different levels, so the teacher prepares tasks at several levels. This situation describes a ___.","Mixed-Ability Class","Group Work","Classroom Climate","<b>Mixed-Ability Class</b>: A class containing learners with different levels of ability or proficiency.<br><i>Example: One English class contains beginner and stronger students.</i>"]],"c":null},{"id":"case-4","l":5,"k":"cases","kn":"Classroom cases","o":1,"t":"Case: Learner Language","ic":"🌱","w":[["Over-generalization","Applying a language rule too widely, including to exceptions."],["Fossilization","A state in which certain non-target-like language features become stable and resistant to change."],["Interlanguage","A learner's developing language system that has its own patterns and changes over time."],["Affective Filter","The idea that emotional factors such as anxiety or low motivation can affect how effectively learners benefit from language input."],["Comprehensible Input","Language input that learners can understand sufficiently to support development, often with some material slightly beyond their current level."],["Scaffolding","Temporary support provided to help learners perform a task they cannot yet complete independently."]],"g":[["A learner says 'I goed to school yesterday', applying the regular -ed ending to an irregular verb. This is ___.","Over-generalization","Fossilization","Interference","<b>Over-generalization</b>: Applying a language rule too widely, including to exceptions.<br><i>Example: A learner says 'goed' instead of 'went'.</i>"],["A learner has made the same pronunciation error for years despite correction and plenty of exposure. This is ___.","Fossilization","Over-generalization","Interlanguage","<b>Fossilization</b>: A state in which certain non-target-like language features become stable and resistant to change.<br><i>Example: A learner continues using the same grammatical error despite instruction.</i>"],["A learner's developing English system is neither their first language nor the target language. This system is called ___.","Interlanguage","Fossilization","Language Transfer","<b>Interlanguage</b>: A learner's developing language system that has its own patterns and changes over time.<br><i>Example: A learner may consistently use a form that differs from both Khmer and standard English.</i>"],["A very anxious learner hears the input but cannot take it in because of nerves. Krashen would call this a high ___.","Affective Filter","Noticing","Scaffolding","<b>Affective Filter</b>: The idea that emotional factors such as anxiety or low motivation can affect how effectively learners benefit from language input.<br><i>Example: High anxiety may reduce a student's willingness to participate.</i>"],["The teacher provides input slightly above the learner's present level. This is ___.","Comprehensible Input","Comprehensible Output","Explicit Instruction","<b>Comprehensible Input</b>: Language input that learners can understand sufficiently to support development, often with some material slightly beyond their current level.<br><i>Example: A teacher uses pictures and simple language to make a story understandable.</i>"],["The teacher gives temporary support that is gradually removed as the learner becomes independent. This is ___.","Scaffolding","Zone of Proximal Development","Noticing","<b>Scaffolding</b>: Temporary support provided to help learners perform a task they cannot yet complete independently.<br><i>Example: The teacher provides sentence starters before students write independently.</i>"]],"c":null},{"id":"case-5","l":5,"k":"cases","kn":"Classroom cases","o":1,"t":"Case: Language Analysis","ic":"🔎","w":[["Homonym","A word form that is identical to another form in sound or spelling but has a different meaning."],["Polysemy","A situation in which one word has several related meanings."],["Cohesion","The grammatical and lexical links that connect parts of a text."],["Indirect Speech Act","A speech act in which the intended function differs from the literal grammatical form."],["Minimal Pair","Two words that differ in only one phoneme and have different meanings."],["Derivation","Forming a new word by adding an affix to a base or stem."]],"g":[["'Bank' (of a river) and 'bank' (for money) share a form but their meanings are unrelated. This is ___.","Homonym","Polysemy","Synonymy","<b>Homonym</b>: A word form that is identical to another form in sound or spelling but has a different meaning.<br><i>Example: Bat can refer to an animal or a piece of sports equipment.</i>"],["'Head' can mean a body part, a leader or the top of a page, and the meanings are related. This is ___.","Polysemy","Homonym","Hyponymy","<b>Polysemy</b>: A situation in which one word has several related meanings.<br><i>Example: Head can refer to a body part or the leader of a group.</i>"],["A paragraph uses 'however', 'therefore' and pronouns to link its sentences together. This feature is ___.","Cohesion","Coherence","Schema","<b>Cohesion</b>: The grammatical and lexical links that connect parts of a text.<br><i>Example: Pronouns, conjunctions, repetition, and substitution can create cohesion.</i>"],["A speaker says 'It's cold in here' meaning 'Please close the window'. This is an ___.","Indirect Speech Act","Direct Speech Act","Presupposition","<b>Indirect Speech Act</b>: A speech act in which the intended function differs from the literal grammatical form.<br><i>Example: Could you close the door? is grammatically a question but functions as a request.</i>"],["'Pat' and 'bat' differ in only one sound, and that sound changes the meaning. This pair is called a ___.","Minimal Pair","Allophone","Assimilation","<b>Minimal Pair</b>: Two words that differ in only one phoneme and have different meanings.<br><i>Example: ship/sheep is a minimal pair.</i>"],["Adding -ness to 'kind' makes 'kindness'. This word-formation process is ___.","Derivation","Compounding","Blending","<b>Derivation</b>: Forming a new word by adding an affix to a base or stem.<br><i>Example: Happy becomes unhappy.</i>"]],"c":null},{"id":"case-6","l":5,"k":"cases","kn":"Classroom cases","o":1,"t":"Case: Assessment Cases","ic":"📋","w":[["Achievement Test","A test designed to measure what learners have learned from a particular course or program."],["Placement Test","A test used to determine an appropriate level or class for a learner."],["Portfolio","A purposeful collection of learner work used to demonstrate progress or achievement."],["Validity","The degree to which an assessment measures what it is intended to measure."],["Reliability","The consistency or stability of assessment results."],["Washback","The effect that testing and assessment have on teaching and learning."]],"g":[["An end-of-term exam measures how much learners achieved from the course content. This is an ___.","Achievement Test","Proficiency Test","Placement Test","<b>Achievement Test</b>: A test designed to measure what learners have learned from a particular course or program.<br><i>Example: A final test based on Units 1–6.</i>"],["On the first day, a test is used to put learners into the right class level. This is a ___.","Placement Test","Achievement Test","Aptitude Test","<b>Placement Test</b>: A test used to determine an appropriate level or class for a learner.<br><i>Example: A language school tests students before assigning classes.</i>"],["Learners keep a collection of their work across the semester to show progress. This is a ___.","Portfolio","Rubric","Washback","<b>Portfolio</b>: A purposeful collection of learner work used to demonstrate progress or achievement.<br><i>Example: A student keeps drafts and final versions of essays.</i>"],["A reading test actually measures reading ability, not background knowledge. This quality is ___.","Validity","Reliability","Practicality","<b>Validity</b>: The degree to which an assessment measures what it is intended to measure.<br><i>Example: A speaking test should actually assess speaking ability.</i>"],["The same test gives consistent scores on different days and with different markers. This quality is ___.","Reliability","Validity","Washback","<b>Reliability</b>: The consistency or stability of assessment results.<br><i>Example: A reliable test gives similar results under similar conditions.</i>"],["Because the national exam has no speaking section, teachers stop teaching speaking. This effect is ___.","Washback","Validity","Practicality","<b>Washback</b>: The effect that testing and assessment have on teaching and learning.<br><i>Example: A high-stakes grammar exam may cause teachers to focus heavily on grammar drills.</i>"]],"c":null},{"id":"case-7","l":5,"k":"cases","kn":"Classroom cases","o":1,"t":"Case: Curriculum and Practice","ic":"📚","w":[["Positive Reinforcement","Adding a desirable consequence to increase a behavior."],["Action Research","Systematic inquiry conducted by practitioners to improve their own practice."],["Triangulation","Using multiple data sources, methods, researchers, or perspectives to strengthen the credibility of findings."],["Skimming","Reading quickly to get the general idea of a text."],["Scanning","Reading quickly to find a specific piece of information."],["Needs Analysis","The systematic process of identifying learners' needs, goals, current abilities, and learning gaps."]],"g":[["A teacher praises a learner immediately after a correct answer so the behaviour is repeated. This is ___.","Positive Reinforcement","Negative Reinforcement","Punishment","<b>Positive Reinforcement</b>: Adding a desirable consequence to increase a behavior.<br><i>Example: Giving praise after a student completes a task.</i>"],["A teacher plans a change, tries it in her own class, observes the results and reflects. This is ___.","Action Research","Case Study","Questionnaire","<b>Action Research</b>: Systematic inquiry conducted by practitioners to improve their own practice.<br><i>Example: A teacher tests a new reading strategy, collects evidence, and reflects on the results.</i>"],["A researcher compares interviews, observations and questionnaires to check the findings. This is ___.","Triangulation","Observation","Case Study","<b>Triangulation</b>: Using multiple data sources, methods, researchers, or perspectives to strengthen the credibility of findings.<br><i>Example: Combining observations, interviews, and test data.</i>"],["Learners read quickly to get the general idea of a text. This is ___.","Skimming","Scanning","Intensive Reading","<b>Skimming</b>: Reading quickly to get the general idea of a text.<br><i>Example: Glancing over headings and the first lines to find what an article is about.</i>"],["Learners look through a timetable to find one specific time. This is ___.","Scanning","Skimming","Extensive Reading","<b>Scanning</b>: Reading quickly to find a specific piece of information.<br><i>Example: Looking through a timetable for the 9:00 train.</i>"],["Before designing the course, a teacher surveys learners about their goals and difficulties. This is ___.","Needs Analysis","Syllabus","Learning Outcome","<b>Needs Analysis</b>: The systematic process of identifying learners' needs, goals, current abilities, and learning gaps.<br><i>Example: A teacher surveys students to identify their English needs.</i>"]],"c":null}]);

function editor(){const m=ed,I=(v,h)=>`value="${esc(v)}" oninput="${h}=this.value"`;
return mbox()+`<div class="card"><h2>${S.custom.some(x=>x.id===m.id)?'Edit stage':'New stage'}</h2><label>Title<input ${I(m.t,'ed.t')}></label><label>Icon (one emoji)<input ${I(m.ic,'ed.ic')}></label><label>Level<select onchange="ed.l=+this.value">${LV.map((v,i)=>`<option value="${i}" ${+m.l===i?'selected':''}>Level ${i+1}: ${v.n} (${v.c})</option>`).join('')}</select></label>
<label>Words (one per line: word | clue). The clue can be an emoji or a short meaning. Needs 4 or more. Single words made only of letters are also used in Spell the Spell.<textarea oninput="ed.wt=this.value">${esc(m.wt)}</textarea></label>
<label>Questions (optional, one per line: sentence with ___ | right answer | wrong answer | wrong answer | explanation, which is optional). Needs 3 or more for Bridge Builder.<textarea oninput="ed.gt=this.value">${esc(m.gt)}</textarea></label>
<label>Word Catch (optional): first category name<input ${I(m.ca,'ed.ca')}></label><label>Words for the first category (commas, at least 3)<input ${I(m.cw1,'ed.cw1')}></label><label>Second category name<input ${I(m.cb,'ed.cb')}></label><label>Words for the second category (commas, at least 3)<input ${I(m.cw2,'ed.cw2')}></label>
<p><button class="btn alt" onclick="savem(false)">Save draft</button><button class="btn alt" onclick="pv(ed)">Preview</button><button class="btn" onclick="savem(true)">Publish</button><button class="btn alt" onclick="ed=null;msg='';render()">Close without saving</button></p></div>`}
function savem(pub){if(pub){const e=chk(ed);if(e){msg=e;return render()}}ed.pub=pub;const i=S.custom.findIndex(x=>x.id===ed.id);if(i<0)S.custom.push(ed);else S.custom[i]=ed;ed=null;msg=pub?'Published. It is now in its level.':'Draft saved.';rebuild();sv();render()}
function tpub(i){const m=S.custom[i];if(!m.pub){const e=chk(m);if(e){msg=e;return render()}}m.pub=!m.pub;msg=m.pub?'Published. It is now in its level.':'Unpublished.';rebuild();sv();render()}
function tdel(i){if(pend!=='d'+i){pend='d'+i;return render()}S.custom.splice(i,1);pend=null;rebuild();sv();render()}
function pv(m){const e=chk(m);if(e){msg=e;return render()}const c=cm(m),it=rounds(c);if(!it.length){msg='Not enough content for any game. Add more words.';return render()}msg='';mk(c,'prev',it)}
function imp(){const t=document.getElementById('impt').value;try{const a=JSON.parse(t);if(!Array.isArray(a))throw 0;let n=0;a.forEach(m=>{if(m&&m.id&&typeof m.t==='string'&&typeof m.wt==='string'&&!S.custom.some(x=>x.id===m.id)){S.custom.push(Object.assign(nm(),m,{pub:false}));n++}});msg=n+' stage'+(n===1?'':'s')+' imported as drafts.';sv();render()}catch(e){msg='That text is not a valid export.';render()}}
function render(){$.innerHTML=hdr()+(M?(M.res?results():M.ph==='sum'?rsum():play()):nav()+({home,map,vault,shop,teach}[tab])());const f=$.querySelector('[data-f]');if(f)f.focus();post()}
render();
</script></body></html>
