<style>

.scroll{background:#f3e6c8;color:#2a2118;border-radius:6px;padding:16px 20px;margin-bottom:12px;font:1.1rem/1.7 Literata,Georgia,serif;box-shadow:0 0 0 3px #c9a35a inset;text-align:center}

.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}

.fb{border-left:5px solid var(--teal);background:#0f3a40;padding:12px 14px;border-radius:8px;margin:10px 0}.fb.no{border-color:var(--bad);background:#40222c}

.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;font-size:.9rem}.st{font-weight:800;color:var(--gold)}

.bsk{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bsk .btn{margin:0;padding:16px 8px;font-size:1.05rem}
.mon{font-size:3rem;text-align:center;line-height:1.2}.hp{display:flex;gap:4px;justify-content:center}.hp i{width:36px;height:8px;border-radius:5px;background:#3b4d5a}.hp i.on{background:#ff6b5b}

.sl{width:34px;height:42px;border-bottom:3px solid var(--gold);display:grid;place-items:center;font:800 1.4rem Figtree,sans-serif;text-transform:uppercase}.sl.f{color:var(--teal)}.sl.r{color:var(--bad)}
.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}.tile{width:46px;height:50px;border-radius:10px;border:0;background:var(--gold);color:#2a1d05;font:800 1.3rem Figtree,sans-serif;cursor:pointer}.tile:disabled{opacity:.25}
@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}.shk{animation:shk .25s}
.bridge{position:relative;margin:34px 0 14px}.pls{display:flex}.pl{flex:1;text-align:center;font-size:1.6rem;border-top:4px solid #8a5a2a;padding-top:2px}
.hero{position:absolute;top:-34px;font-size:1.7rem;transition:left .5s;transform:translateX(30%)}
.vil{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.bd{background:#0f2c40;border:1px solid var(--line);border-radius:10px;text-align:center;padding:10px 4px}.bd span{font-size:2rem;display:block}.bd small{color:var(--mut);font-size:.78rem}.bd.ru{opacity:.55;filter:grayscale(1)}
label{display:block;margin:10px 0 4px;font-weight:600}input,textarea,select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:#0f2c40;color:var(--ink);font:inherit}textarea{min-height:90px}
.card2.up .def{font-size:.82rem;line-height:1.35}.card2 b{font-size:.95rem}.fb p{margin:8px 0 0}details summary{cursor:pointer;margin-bottom:8px}

<script>
const LV=[{n:'Language Foundations',c:'Linguistics',ic:'🔤',d:'Linguistics, semantics, morphology, phonology, grammar, discourse and pragmatics'},{n:'Acquisition & Applied Linguistics',c:'SLA',ic:'🧠',d:'How languages are acquired, learner factors and communicative competence'},{n:'Methods & Classroom Practice',c:'Teaching',ic:'🎯',d:'Approaches, methods, techniques, classroom management and language skills'},{n:'Assessment, Curriculum & Profession',c:'Profession',ic:'📝',d:'Testing, curriculum design, research and professional practice'},{n:'Exam Distinctions',c:'Exam',ic:'⚖️',d:'The pairs of terms that examiners love to ask you to tell apart'},{n:'Classroom Cases',c:'Cases',ic:'🏫',d:'Short classroom situations: name the method, technique or concept'}];
const R=[[25,35],[25,35],[30,40],[30,40],[35,45],[40,50]];
const shuf=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const CATS=[{"id":"c1","s":"Linguistics","n":"Linguistics & Nature of Language","l":0,"ic":"🔤","t":[["Arbitrariness","The lack of a natural connection between a linguistic form and its meaning.","There is nothing naturally tree-like about the English word 'tree'.",3],["Competence","A speaker's underlying knowledge of a language system.","Knowing how English sentences are formed even when not currently speaking.",3],["Connotation","The additional emotional, cultural, or associative meanings linked to a word.","The word 'home' can connote comfort and belonging.",3],["Denotation","The basic, literal, or dictionary meaning of a word.","The denotation of 'snake' is a type of reptile.",3],["Displacement","The ability to communicate about people, places, objects, or events that are not present in the immediate situation.","We can discuss yesterday's meeting or next year's plans.",3],["Duality of Patterning","The organization of language at two levels: meaningless sounds combine to form meaningful units.","Individual sounds combine to form words such as 'cat'.",3],["Innateness","The idea that humans have an inborn capacity that supports language development.","Children normally acquire language without formal grammar lessons.",3],["Language Creativity","The capacity to create and understand novel utterances using a limited linguistic system.","A learner can produce a new sentence using familiar vocabulary and grammar.",3],["Language Design Features","Properties that distinguish human language, such as arbitrariness, duality, productivity, and displacement.","Displacement allows people to discuss things outside the immediate situation.",3],["Linguistic Sign","A meaningful unit that connects a form with a meaning.","The spoken or written form 'tree' is linked to the concept of a tree.",3],["Linguistics","The scientific study of language and its structure, meaning, use, and development.","Linguists study sounds, words, grammar, meaning, and language use.",3],["Open-endedness","The ability of human language to produce an unlimited number of new expressions.","Speakers can create sentences they have never heard before.",3],["Performance","The actual use of language in real situations, which may include mistakes or hesitations.","A speaker may know English grammar but make a slip while speaking quickly.",3],["Psycholinguistics","The study of how language is processed, learned, understood, and produced by the mind.","Studying how learners process new vocabulary.",3],["Rule-Governed Language","The idea that language is organized by systematic patterns rather than random combinations.","English speakers generally follow rules for word order even when they do not consciously know them.",3],["Second Language Acquisition (SLA)","The study of how people develop knowledge and ability in a language learned after their first language.","SLA research examines how learners develop English over time.",3],["Semantics","The study of meaning in language.","Studying the meaning of words and sentences.",3],["Sociolinguistics","The study of the relationship between language and society.","Studying how language varies across social groups.",3],["Syntax","The study of how words combine into phrases, clauses, and sentences.","Studying English word order.",3],["Corpus Linguistics","The study of language using large collections of real spoken or written texts.","Using a corpus to examine common English collocations.",2],["Diachronic Study","The study of how a language changes over time.","Studying how English vocabulary developed from Old English to Modern English.",2],["Ideational Metafunction","The function of language for representing experience, events, and ideas.","A sentence describes what happened and who was involved.",2],["Interpersonal Metafunction","The function of language for expressing attitudes and managing social relationships.","A speaker uses politeness to maintain a relationship.",2],["Language Universals","Features or principles that are found across human languages.","All human languages have ways of expressing meanings such as events and participants.",2],["Langue","The shared system of language, including its conventions and rules, associated with Saussure.","The English system of grammar and vocabulary shared by speakers.",2],["Metafunction","A broad communicative function of language in systemic functional linguistics.","Language can represent experience, build relationships, and organize messages.",2],["Neurolinguistics","The study of the relationship between language and the brain.","Studying language disorders after brain injury.",2],["Paradigmatic Relationship","A relationship between linguistic choices that can substitute for one another in the same position.","In 'The boy runs', 'boy', 'girl', and 'student' can occupy the same position.",2],["Parole","Actual individual acts of speaking or language use, associated with Saussure.","A person's particular sentence spoken in a conversation.",2],["Sapir-Whorf Effect","The view that language and patterns of thought are related, with stronger versions proposing that language influences how people perceive the world.","Different languages may encourage speakers to pay attention to different distinctions.",2],["Sense","The meaning relationship of a word within the linguistic system, independent of a specific real-world referent.","The sense of 'teacher' includes its relationship to concepts such as 'student' and 'school'.",2],["Signified","The concept or meaning represented by a signifier.","The mental concept of a tree is the signified.",2],["Signifier","The form of a linguistic sign, such as a sound sequence or written word.","The sounds /triː/ are the signifier in 'tree'.",2],["Stimulus Freedom","The ability to use language without being directly controlled by an immediate external stimulus.","A person can talk about an imaginary situation without seeing it.",2],["Synchronic Study","The study of a language at a particular point in time.","Studying the grammar of present-day English.",2],["Syntagmatic Relationship","A relationship between linguistic elements that occur together in a sequence.","In 'The small boy runs', the words form a sequence with grammatical relationships.",2],["Textual Metafunction","The function of language for organizing a message into a coherent text.","Information is arranged so the listener can follow the message.",2],["Animal Communication","Systems used by animals to exchange information, which differ from the productive and flexible nature of human language.","Bees use movement to communicate information about food locations.",1]]},{"id":"c2","s":"Semantics","n":"Semantics & Lexical Meaning","l":0,"ic":"💭","t":[["Agent","The participant that intentionally performs an action.","In 'Sara opened the window', Sara is the Agent.",3],["Antonymy","A relationship between words with opposite or contrasting meanings.","hot/cold.",3],["Collocation","A combination of words that commonly occur together.","Make a decision is a common collocation.",3],["Homonym","A word form that is identical to another form in sound or spelling but has a different meaning.","Bat can refer to an animal or a piece of sports equipment.",3],["Homophone","A word that sounds the same as another word but has a different meaning and usually different spelling.","Two/too.",3],["Hyponymy","A relationship in which one word represents a more specific member of a broader category.","Rose is a hyponym of flower.",3],["Lexical Relation","A relationship between the meanings or forms of words.","Synonymy and antonymy are lexical relations.",3],["Polysemy","A situation in which one word has several related meanings.","Head can refer to a body part or the leader of a group.",3],["Semantic Feature","A basic meaning component used to distinguish words.","Man can be described with features such as [+human], [+adult], [+male].",3],["Semantic Role","The role a noun phrase plays in the situation described by a sentence.","In 'The student opened the door', 'the student' has the Agent role.",3],["Synonymy","A relationship between words with similar or closely related meanings.","begin/start.",3],["Theme","The participant that is moved, affected, or involved in an event without necessarily causing it.","In 'Sara opened the window', the window is the Theme.",3],["Associative Meaning","Meaning connected to personal, cultural, emotional, or social associations.","The word 'school' may evoke memories, exams, friends, or teachers.",2],["Conceptual Meaning","The core, relatively stable meaning of a word or expression.","The conceptual meaning of 'bachelor' includes the idea of an unmarried adult man.",2],["Experiencer","A participant that feels, perceives, or experiences something.","In 'Mina likes music', Mina is the Experiencer.",2],["Goal","The endpoint or destination toward which something moves.","In 'She walked to the school', the school is the Goal.",2],["Hypernym","A broader category term that includes a more specific word.","Flower is a hypernym of rose.",2],["Instrument","An object used to carry out an action.","In 'He cut the bread with a knife', the knife is the Instrument.",2],["Location","The place where an event or state occurs.","In 'The children studied in the library', the library is the Location.",2],["Metonymy","A meaning relationship in which one thing is referred to by the name of something closely associated with it.","The White House announced... uses a place to refer to the administration.",2],["Prototype","The most typical or representative example of a category.","A robin may be considered a more typical bird than a penguin for many speakers.",2],["Source","The starting point from which something moves or originates.","In 'She walked from the school', the school is the Source.",2],["Word Play","Creative or humorous use of language based on meanings, sounds, or forms of words.","A joke may depend on a word having two meanings.",1]]},{"id":"c12","s":"Vocabulary & Morphology","n":"Vocabulary, Morphology & Word Formation","l":0,"ic":"🧱","t":[["Allomorph","A variant form of a morpheme that occurs in different contexts without changing its basic function or meaning.","The plural morpheme has pronunciations such as /s/, /z/, and /ɪz/.",3],["Blending","Creating a new word by combining parts of two or more words.","Brunch comes from breakfast + lunch.",3],["Borrowing","Taking a word or expression from another language.","English borrowed bungalow from South Asian languages.",3],["Bound Morpheme","A morpheme that must be attached to another form.","The plural -s in books is a bound morpheme.",3],["Compounding","Combining two or more words or roots to form a new lexical item.","Toothbrush combines tooth + brush.",3],["Derivation","Forming a new word by adding an affix to a base or stem.","Happy becomes unhappy.",3],["Morpheme","The smallest linguistic unit that carries meaning or grammatical function.","Un-happy contains two morphemes.",3],["Morphology","The study of word structure and word formation.","Morphology analyzes how words are built from smaller units.",3],["Vocabulary","The set of words and lexical items known or used by a person, group, or language.","A learner's English vocabulary includes words they understand and/or use.",3],["Vocabulary Depth","The richness of knowledge about a word, including meaning, form, use, collocations, and relationships.","Knowing 'run' includes its meanings, forms, collocations, and different uses.",3],["Word Formation","The processes through which new words are created or existing words change form.","Derivation and compounding are word-formation processes.",3],["Acronym","A word formed from the initial letters of a series of words and pronounced as a word.","UNESCO is an acronym.",2],["Backformation","Creating a new word by removing what is interpreted as an affix from an existing word.","Edit was historically formed from editor.",2],["Clipping","Creating a shorter word from a longer word.","Advertisement becomes ad.",2],["Free Morpheme","A morpheme that can occur independently as a word.","Book can stand alone.",2],["Vocabulary Breadth","The number or range of words a learner knows.","Knowing many different English words reflects greater vocabulary breadth.",2],["Zero-Derivation","Changing a word's grammatical category without adding an affix.","Email can function as a noun and as a verb.",2],["Bifurcation","A semantic development in which one form develops or splits into distinct related or specialized meanings.","A historical word may develop separate meanings in different contexts.",1],["Extension","A process in which an existing word develops a broader range of meaning.","A word may extend from a specific sense to a more general one.",1],["Invention","Creating a completely new word or form.","A brand or technology may introduce a new lexical item.",1],["Morph","The actual form used to realize a morpheme in a particular word.","The different forms of the plural morpheme are morphs.",1],["Narrowing","A process in which a word develops a more restricted meaning.","A word can change from a broad category to a more specific one.",1]]},{"id":"c13","s":"Phonetics & Phonology","n":"Phonetics & Phonology","l":0,"ic":"🔊","t":[["Connected Speech","Natural spoken language in which sounds may change, link, reduce, or disappear.","Want to may be pronounced with connected-speech features in rapid conversation.",3],["Intonation","Changes in pitch across an utterance that contribute to meaning and discourse.","Rising intonation can help signal a question in some contexts.",3],["Manner of Articulation","The way airflow is obstructed or shaped to produce a consonant.","Stops, fricatives, and nasals are different manners of articulation.",3],["Minimal Pair","Two words that differ in only one phoneme and have different meanings.","ship/sheep is a minimal pair.",3],["Phoneme","The smallest sound unit that can distinguish meaning in a particular language.","/p/ and /b/ are separate phonemes in English because pat and bat differ in meaning.",3],["Phonetics","The scientific study of speech sounds, including their production, transmission, and perception.","Phonetics studies how /p/ is physically produced.",3],["Phonology","The study of how speech sounds function and are organized in a particular language.","Phonology explains why changing one sound can change meaning in English.",3],["Place of Articulation","The location in the vocal tract where a speech sound is produced.","The lips are the place of articulation for /p/ and /b/.",3],["Stress","Relative prominence given to a syllable or word through features such as loudness, length, pitch, and vowel quality.","PREsent and preSENT can differ in stress placement.",3],["Voiced Sound","A sound produced with vibration of the vocal folds.","The /z/ sound is voiced.",3],["Voiceless Sound","A sound produced without vibration of the vocal folds.","The /s/ sound is voiceless.",3],["Consonant Charting","The systematic classification of consonants according to place and manner of articulation and voicing.","English consonants can be organized in a chart using these features.",2],["Rhythm","The pattern of stressed and unstressed syllables in speech.","English has a characteristic stress-timed rhythm.",2],["Sentence Stress","The prominence given to particular words in a sentence.","Content words are often more prominent than function words.",2],["Word Stress","The prominence given to one syllable within a word.","PHOtograph has stress on the first syllable.",2],["Allophone","A variant pronunciation of the same phoneme that does not change meaning.","The /p/ in 'pin' (aspirated) and in 'spin' (unaspirated) are allophones of /p/.",3],["Consonant","A speech sound made by blocking or narrowing the airflow in the mouth or throat.","/p/, /s/ and /m/ are consonants.",2],["Vowel","A speech sound made with open airflow and no blocking; the vocal tract is not closed.","/i:/ in 'see' and /ɑ:/ in 'car' are vowels.",2],["Diphthong","A vowel sound that glides from one vowel position to another within one syllable.","/aɪ/ in 'time' and /eɪ/ in 'day'.",2],["Monophthong","A pure vowel sound with one steady quality throughout.","/iː/ in 'see' and /ʊ/ in 'book'.",2],["Syllable","A unit of pronunciation built around one vowel sound, with or without consonants.","'Teacher' has two syllables: tea-cher.",2],["Schwa","The weak, neutral vowel /ə/, the most common sound in English, found in unstressed syllables.","The first and last vowels in 'banana' /bəˈnɑːnə/.",3],["Assimilation","A connected-speech change in which a sound becomes more like a neighbouring sound.","'Good boy' is often said as 'goob boy'.",3],["Elision","The omission of a sound in fast or connected speech.","'Next day' is said as 'nex day'.",3],["Weak Form","The reduced pronunciation of a function word when it is unstressed, often with a schwa.","'Can' in 'I can go' is pronounced /kən/.",2],["Linking","Joining the end of one word to the start of the next in connected speech so that they flow together.","'An apple' sounds like 'a napple'.",2],["Segmental Features","The individual sounds of a language, meaning its consonants and vowels.","Teaching the difference between /ɪ/ and /iː/ in 'ship' and 'sheep'.",2],["Suprasegmental Features","Features of speech that extend over more than one sound: stress, rhythm and intonation.","Rising intonation in a question such as 'Are you ready?'.",3]]},{"id":"c11","s":"Grammar","n":"Grammar & Functional Grammar","l":0,"ic":"📐","t":[["Clause","A grammatical unit containing a verb and its associated elements.","Because she studied is a dependent clause.",3],["Descriptive Grammar","A description of how speakers actually use a language.","A descriptive grammar records patterns found in real English use.",3],["Form","The grammatical shape or structure of a language item.","The form 'has eaten' is a present perfect structure.",3],["Form and Function","The relationship between the grammatical shape of language and the communicative purpose it serves.","A question form can function as a request.",3],["Function","The communicative purpose served by a linguistic form.","The present perfect can express an experience or a past event relevant to the present.",3],["Functional Grammar","A grammar that explains how grammatical structures function to create meaning in context.","Passive voice can foreground the action or result rather than the actor.",3],["Learning Grammar","Developing the ability to understand and use grammatical patterns in meaningful communication.","Students learn the past tense through both explanation and meaningful use.",3],["Prescriptive Grammar","Rules that state how language should be used according to a particular standard.","A prescriptive rule may tell learners to avoid certain forms in formal writing.",3],["Teaching Grammar","The process of helping learners understand and use grammatical forms accurately and appropriately.","A teacher combines explanation, examples, practice, and communication.",3],["Clause Complex","A larger grammatical structure formed by linking clauses.","Although it rained, the students continued the activity.",2],["Discourse Grammar","The study of grammar as it operates across connected discourse rather than only in isolated sentences.","Pronoun choice can connect one sentence to another.",2],["Grammar-Lexis Interdependence","The idea that grammatical and lexical choices work together rather than being completely separate systems.","The verb 'depend' commonly occurs with the preposition 'on'.",2],["Language Universal in Grammar","A grammatical property or tendency found across many languages.","Researchers compare languages to identify common structural patterns.",2],["Lexicogrammar","The close relationship between vocabulary and grammar in constructing meaning.","Words such as 'depend' and 'on' form a conventional grammatical-vocabulary pattern.",2],["Spoken Grammar","Patterns of grammar commonly found in spoken interaction.","Spoken English often contains ellipsis and discourse markers.",2],["Written Grammar","Grammatical patterns characteristic of written language.","Formal writing often uses more complete structures than casual speech.",2],["Token","Each individual occurrence of a word or form in a text.","If 'students' appears three times, there are three tokens of that word.",1],["Type","A distinct word or linguistic form counted as a category in a text.","In 'students study and students learn', 'students' is one type.",1],["Inflection","A change to the form of a word to show grammatical meaning, without changing its word class.","walk → walks, walked, walking; cat → cats.",3],["Tense","A grammatical form that shows the time of an action (present, past, future).","She walks (present) / She walked (past).",2],["Aspect","A grammatical view of an action: whether it is complete, in progress or repeated.","She is writing (progressive) / She has written (perfect).",3],["Voice","The grammatical relationship between the verb and the subject: active or passive.","The teacher marked the test (active) / The test was marked (passive).",2],["Mood","The speaker's attitude to the action shown by the verb: statement (indicative), command (imperative) or wish or doubt (subjunctive).","If I were you, I would study. (subjunctive)",1],["Modal","An auxiliary verb that expresses ability, possibility, permission or obligation.","can, could, may, might, must, should, will, would.",2],["Agreement","The matching of a verb with its subject in number and person, or of other related words.","She teaches (not 'She teach').",2]]},{"id":"c9","s":"Discourse","n":"Discourse Analysis","l":0,"ic":"📖","t":[["Background Knowledge","Knowledge a person already has that helps them understand new language or discourse.","Knowing how schools work helps a learner understand a school timetable.",3],["Coherence","The overall meaningful and logical connection of ideas in a text or conversation.","A paragraph is coherent when its ideas clearly support one another.",3],["Cohesion","The grammatical and lexical links that connect parts of a text.","Pronouns, conjunctions, repetition, and substitution can create cohesion.",3],["Conjunction","A linguistic device that explicitly signals relationships between clauses or ideas.","However, because, and, and therefore show logical relationships.",3],["Cooperative Principle","Grice's idea that participants generally cooperate to make conversation effective and meaningful.","Speakers normally provide information relevant to the conversation.",3],["Discourse","Connected spoken or written language beyond the level of an individual sentence.","A classroom discussion is a discourse.",3],["Discourse Analysis","The study of how language is organized and used in real spoken or written communication.","Analyzing how a teacher and students interact during a lesson.",3],["Ellipsis","Omission of information that can be understood from the context.","John can play the guitar, and Mary can too.",3],["Implicature","Meaning that is suggested or inferred rather than directly stated.","If someone says 'It is getting late,' they may imply that it is time to leave.",3],["Lexical Cohesion","Cohesion created through relationships among vocabulary items.","Repetition, synonymy, and related words can connect a text.",3],["Schema","An organized mental framework for understanding a type of situation or concept.","A restaurant schema includes ordering, eating, paying, and leaving.",3],["Turn-Taking","The system by which speakers manage who speaks, when, and for how long.","A student waits for the teacher to finish before answering.",3],["Conversation Analysis","The study of how people organize naturally occurring conversation.","Researchers analyze pauses, turns, interruptions, and repairs.",2],["Hedge","A word or expression that makes a statement less direct, absolute, or certain.","Perhaps, probably, I think, and somewhat can function as hedges.",2],["Interpreting Discourse","Understanding meaning by considering linguistic form, context, relationships, and background knowledge.","A listener interprets 'It's cold here' as a possible request to close a window.",2],["Repetition","The deliberate or natural reuse of words or ideas to create connection or emphasis in a text.","The repeated key term 'education' helps maintain the topic.",2],["Script","A mental sequence of expected events in a familiar situation.","A doctor's visit script may include registration, examination, and advice.",2],["Speech Event","A communicative event defined by its participants, purpose, setting, and conventions.","A job interview is a speech event with specific expectations.",2],["Substitution","Replacing a word or phrase with another form to avoid unnecessary repetition.","I need a pen. Do you have one?",2]]},{"id":"c10","s":"Pragmatics","n":"Pragmatics & Context","l":0,"ic":"🧩","t":[["Anaphora","A linguistic relationship in which an expression refers back to something previously mentioned.","Sara bought a book. She read it at night.",3],["Context","The linguistic, social, physical, and cultural situation in which communication occurs.","The meaning of 'here' depends on where the speaker is.",3],["Deixis","Words whose interpretation depends on the context of the utterance.","Here, there, now, then, I, and you are deictic expressions.",3],["Indirect Speech Act","A speech act in which the intended function differs from the literal grammatical form.","Could you close the door? is grammatically a question but functions as a request.",3],["Inference","A conclusion that a listener or reader draws from available information.","From 'The ground is wet,' a reader may infer that it has rained.",3],["Politeness","Linguistic and social strategies used to maintain respectful relationships and reduce interpersonal conflict.","Using 'Could you please...' can make a request more polite.",3],["Pragmatics","The study of how meaning is communicated and interpreted in context.","Understanding that 'Can you open the door?' is normally a request, not a question about ability.",3],["Presupposition","An assumption that a speaker treats as already accepted or true when making an utterance.","In 'John stopped smoking,' it is presupposed that John used to smoke.",3],["Speech Act","An action performed through speaking, such as requesting, apologizing, promising, or informing.","Saying 'I apologize' performs an apology.",3],["Direct Speech Act","A speech act in which the grammatical form directly matches the communicative function.","Please close the door is directly used as a request.",2],["Invisible Meaning","Meaning that is not directly expressed but must be inferred from context.","The statement 'The room is dark' may indirectly suggest turning on the light.",2],["Negative Face","A person's desire for freedom from pressure or unwanted interference.","A polite request can reduce pressure on the listener.",2],["Positive Face","A person's desire to be liked, approved of, or valued by others.","Complimenting someone can support their positive face.",2],["Reference","The act of using language to identify or point to a person, object, place, or idea.","In 'That book is mine,' 'that book' identifies a particular object.",2]]},{"id":"c3","s":"Language Acquisition","n":"First & Second Language Acquisition","l":1,"ic":"👶","t":[["Acquisition-Learning Distinction","The distinction between natural development of language ability and conscious learning of language rules.","A learner may consciously study the past tense but also acquire patterns through communication.",3],["Affective Factor","An emotional or psychological factor that influences language learning.","Motivation, confidence, and anxiety can affect learning.",3],["Affective Factors","Emotional or psychological factors that influence language learning.","Motivation, confidence, and anxiety can affect learning.",3],["Developing Syntax","The process through which learners acquire rules for combining words into phrases and sentences.","Children move from short combinations to increasingly complex sentences.",3],["First Language Acquisition","The natural development of a person's first language, usually beginning in childhood.","A child develops Khmer through everyday interaction.",3],["Fossilization","A state in which certain non-target-like language features become stable and resistant to change.","A learner continues using the same grammatical error despite instruction.",3],["Language Acquisition","The development of language ability through largely natural, meaningful exposure and use.","A child acquires a first language through interaction with caregivers.",3],["Language Acquisition Process","The gradual development of linguistic knowledge and ability through exposure, interaction, and mental processing.","A child develops vocabulary, grammar, and pronunciation over time.",3],["Language Anxiety","Worry or tension associated with using or learning a language.","A student feels nervous when speaking English in front of the class.",3],["Language Learning","A conscious or intentional process of developing language knowledge and skills, often through instruction.","A student studies English grammar and vocabulary in class.",3],["Motivation","The set of reasons and forces that initiate, direct, and sustain learning behavior.","A learner studies English because they want to communicate with international visitors.",3],["Acquisition Barrier","A factor that makes language development more difficult.","Limited exposure, anxiety, or lack of interaction can become barriers.",2],["Acquisition Schedule","The typical developmental sequence through which language abilities emerge.","Children usually develop babbling before meaningful multiword combinations.",2],["Age of Acquisition","The age at which a person begins learning or acquiring a language.","Age of acquisition can influence pronunciation outcomes.",2],["Babbling","An early stage in which infants produce repeated or varied speech-like syllables.","A baby produces 'ba-ba-ba'.",2],["Caregiver Speech","The simplified, modified, or supportive language adults may use when communicating with young children.","An adult may use shorter sentences and exaggerated intonation with a child.",2],["Critical Period","A proposed period in development during which language learning may be especially sensitive to biological factors.","Researchers debate how age affects pronunciation in second-language learning.",2],["Developing Morphology","The process through which learners acquire word forms and grammatical markers.","A child gradually learns plural -s and past-tense -ed.",2],["Developing Semantics","The development of knowledge about word and sentence meanings.","A child gradually learns distinctions such as 'big' versus 'small'.",2],["Language Aptitude","A person's potential or capacity to learn a new language, often measured through specific abilities.","A language aptitude test may assess sound discrimination and grammatical sensitivity.",2],["One-Word Stage","A stage in early language development in which children use single words to express broader meanings.","A child says 'milk' to mean 'I want milk'.",2],["Telegraphic Speech","Early child language containing mainly meaningful content words while function words may be omitted.","A child says 'Daddy go work'.",2],["Two-Word Stage","A stage in which children begin combining two words to express basic relationships.","A child says 'Mommy go'.",2],["Cooing","An early stage of infant vocal development involving vowel-like sounds.","A baby produces sounds such as 'oo' or 'ah'.",1],["Interference","The influence of the first language on the second, leading to errors.","A learner whose first language has no articles leaves out 'a' and 'the' in English.",3],["Over-generalization","Applying a language rule too widely, including to exceptions.","A learner says 'goed' instead of 'went'.",3],["Comprehensible Output","Swain's idea that learners improve when they must produce language that others can understand.","Students explain a picture to a partner who cannot see it.",2],["Uptake","What a learner notices and uses from correction or input immediately afterwards.","After recast, the learner repeats the corrected form.",2]]},{"id":"c4","s":"Applied Linguistics & SLA","n":"Applied Linguistics & SLA","l":1,"ic":"🔬","t":[["Affective Filter","The idea that emotional factors such as anxiety or low motivation can affect how effectively learners benefit from language input.","High anxiety may reduce a student's willingness to participate.",3],["Applied Linguistics","The interdisciplinary use of knowledge about language to address real-world language-related problems.","Using SLA and linguistics research to improve English teaching.",3],["Comprehensible Input","Language input that learners can understand sufficiently to support development, often with some material slightly beyond their current level.","A teacher uses pictures and simple language to make a story understandable.",3],["Contrastive Analysis","The comparison of two languages to identify similarities and differences that may affect learning.","Comparing Khmer and English word order can help predict possible difficulties.",3],["Error Analysis","The systematic study of learner errors to identify patterns, causes, and implications for teaching.","A teacher analyzes repeated verb-tense errors to plan instruction.",3],["Explicit Instruction","Teaching that directly explains a language rule, concept, or strategy.","The teacher explicitly explains how the past perfect is formed.",3],["Focus on the Learner","An orientation that emphasizes learners' needs, characteristics, strategies, motivation, and participation.","The teacher adapts activities to learners' levels and goals.",3],["Input","Language that learners receive through listening or reading.","Students hear the teacher explain a story.",3],["Interaction","Communication between learners and others that provides opportunities to understand and produce language.","Pair work gives students opportunities to negotiate meaning.",3],["Interlanguage","A learner's developing language system that has its own patterns and changes over time.","A learner may consistently use a form that differs from both Khmer and standard English.",3],["Language Transfer","The influence of previously known language knowledge on another language.","A learner transfers Khmer word-order patterns into English.",3],["Learner-Centeredness","The principle that learning should actively involve learners and respond to their needs and agency.","Students make choices and actively participate in tasks.",3],["Negative Transfer","Transfer that leads to errors because the first language and target language differ.","A learner applies a first-language word-order pattern that is incorrect in English.",3],["Negotiation of Meaning","The interactional process of clarifying and modifying communication when understanding is incomplete.","A student asks, 'Do you mean Monday?' and the speaker clarifies.",3],["Output","Language that learners produce through speaking or writing.","Students explain the story to a partner.",3],["Scaffolding","Temporary support provided to help learners perform a task they cannot yet complete independently.","The teacher provides sentence starters before students write independently.",3],["Second Language Acquisition","The study of how people develop knowledge and ability in a language learned after their first language.","Studying how Cambodian learners develop English.",3],["Transfer","The influence of previously known language knowledge on the learning or use of another language.","A Cambodian learner may transfer a Khmer word-order pattern into English.",3],["Zone of Proximal Development","The range between what a learner can do independently and what they can do with appropriate support.","A learner solves a task with teacher guidance and later completes it alone.",3],["Focus on Method","An orientation that emphasizes the teaching method as a major factor in determining learning outcomes.","A teacher may examine whether a method is appropriate for a particular class.",2],["Implicit Instruction","Teaching in which learners encounter or use a target form without a direct explanation of the rule.","Students repeatedly hear and use a structure in meaningful communication.",2],["Interaction Hypothesis","The view that interaction can support language development by helping learners notice problems, negotiate meaning, and receive feedback.","A student asks for clarification and modifies their understanding.",2],["Noticing","The process of consciously paying attention to a language feature in input.","A learner notices that third-person verbs take -s.",2],["Positive Transfer","Transfer that helps the learner produce or understand the target language.","A similar vocabulary item in two languages may help learning.",2],["Acquisition-Learning Hypothesis","Krashen's claim that adults have two separate systems: subconscious acquisition, which leads to fluency, and conscious learning, which is only used to monitor.","A child picks up English through play (acquisition); a student memorises grammar rules (learning).",3],["Monitor Hypothesis","Krashen's claim that conscious learning works only as an editor (monitor) that checks and corrects output.","A learner corrects a verb ending after speaking because they had time to apply a rule.",3],["Natural Order Hypothesis","Krashen's claim that learners acquire grammatical structures in a predictable order, regardless of the order taught.","Learners usually acquire the progressive -ing before the third-person -s.",3],["Input Hypothesis","Krashen's claim that learners acquire language when they understand input that is slightly beyond their current level (i + 1).","A teacher uses pictures and gestures so students understand a new story.",3],["i + 1","Krashen's formula for ideal input: the learner's current level (i) plus one step beyond it.","A student at beginner level hears simple sentences that contain a few new words.",3],["Monitor Model","Krashen's overall theory of second language acquisition, made up of five hypotheses (acquisition-learning, monitor, natural order, input, affective filter).","Used to explain why comprehensible input and a low-anxiety classroom matter.",2]]},{"id":"c6","s":"Learner Factors","n":"Learning Styles, Strategies & Learner Factors","l":1,"ic":"🧠","t":[["Communication Strategy","A strategy used to overcome problems or gaps during communication.","A learner describes an unknown word instead of stopping communication.",3],["Compensatory Strategy","A strategy used to compensate for limited language knowledge during communication.","Using gestures or paraphrasing when a word is unknown.",3],["Individual Differences","Variations among learners in ability, background, motivation, personality, and learning needs.","Students in one class have different proficiency levels.",3],["Learner Autonomy","The ability and willingness of learners to take responsibility for their own learning.","A student sets vocabulary goals and monitors progress.",3],["Learner Differences","Variations among learners in ability, background, motivation, personality, and learning needs.","Students in one class may have different levels and interests.",3],["Learning Strategy","A deliberate action or technique used by a learner to improve learning.","Using flashcards to review vocabulary is a learning strategy.",3],["Metacognition","Awareness and regulation of one's own thinking and learning processes.","A learner asks, 'Which reading strategy worked best for me?'",3],["Self-Regulation","The ability to plan, monitor, and adjust one's own learning behavior.","A student changes study habits after noticing weak test results.",3],["Ambiguity Tolerance","The degree to which a learner can remain comfortable when information is unclear or uncertain.","A learner with high tolerance may continue communicating despite not knowing every word.",2],["Avoidance Strategy","A communication strategy in which a learner avoids a difficult topic, word, or structure.","A learner changes the topic because they do not know the required vocabulary.",2],["Extrinsic Motivation","Motivation driven by external rewards, requirements, or consequences.","A student studies to pass an exam or obtain a scholarship.",2],["Intrinsic Motivation","Motivation arising from enjoyment, interest, or satisfaction in the activity itself.","A student learns English because they enjoy communicating in English.",2],["Learning Style","A learner's preferred or characteristic way of approaching learning activities.","A learner may prefer visual materials or hands-on activities.",2],["Strategy-Based Instruction","Teaching that explicitly helps learners understand and use effective learning strategies.","A teacher teaches students how to predict content before reading.",2],["Field Independence","A cognitive style involving greater ability to separate relevant information from surrounding context.","A field-independent learner may focus on details within a complex visual task.",1],["Impulsivity","A tendency to respond quickly, sometimes before fully considering alternatives.","An impulsive learner may answer quickly but make more errors.",1],["Reflectivity","A tendency to consider alternatives carefully before responding.","A reflective learner may take more time before answering.",1]]},{"id":"c7","s":"Communicative Competence","n":"Language Teaching & Communicative Competence","l":1,"ic":"🗣️","t":[["Accuracy","The degree to which language use conforms to target-language rules and conventions.","Correct verb tense and subject-verb agreement.",3],["Authentic Materials","Materials created for real-world communication rather than specifically for language teaching.","A real menu, news article, or job advertisement.",3],["Communicative Competence","The ability to use language appropriately and effectively in real communication.","A learner knows grammar and also knows how to make a polite request.",3],["Discourse Competence","The ability to connect sentences and interpret or produce coherent spoken or written discourse.","Writing a paragraph with clear links between ideas.",3],["Fluency","The ability to communicate smoothly and continuously with appropriate speed and few disruptive pauses.","A learner speaks for a minute without frequent breakdowns.",3],["Functional Language","Language used to perform communicative functions such as requesting, apologizing, agreeing, or refusing.","'Could you help me?' functions as a request.",3],["Grammar","The system of rules and patterns that organizes words and structures in a language.","English grammar includes tense and word-order patterns.",3],["Linguistic Competence","Knowledge of the formal system of a language, including grammar, vocabulary, and sound patterns.","Knowing how to form an English question.",3],["Listening Skill","The ability to understand spoken language.","A student identifies the main idea of a short dialogue.",3],["Productive Skills","Language skills involving producing language: speaking and writing.","Students write a paragraph and give a presentation.",3],["Pronunciation","The way words and sounds are produced and perceived in spoken language.","Students practice the pronunciation of /θ/.",3],["Reading Skill","The ability to understand written language.","Students identify the main idea of a passage.",3],["Receptive Skills","Language skills involving receiving and understanding language: listening and reading.","Students listen to a dialogue and answer questions.",3],["Register","A variety or style of language associated with a particular situation, purpose, or relationship.","Formal English is appropriate for a job application.",3],["Sociolinguistic Competence","The ability to use language appropriately according to social context, relationship, and culture.","Using a more polite request with a principal.",3],["Speaking Skill","The ability to communicate ideas and meaning orally.","Students describe a picture to a partner.",3],["Strategic Competence","The ability to use communication strategies to overcome gaps or problems in communication.","Paraphrasing a word that a learner does not know.",3],["Writing Skill","The ability to communicate meaning through written language.","Students write a five-paragraph essay.",3],["Complexity","The range and sophistication of language forms used by a learner.","Using varied sentence structures and vocabulary.",2],["Pronunciation Teaching","Instruction that helps learners produce and understand speech sounds, stress, rhythm, and intonation.","Students practice /θ/ and /ð/ using minimal pairs.",2]]},{"id":"c5","s":"Methods & Approaches","n":"Teaching Approaches, Methods & Techniques","l":2,"ic":"🎯","t":[["Approach","A general set of beliefs about the nature of language and language learning.","A communicative approach emphasizes language as communication.",3],["Audio-Lingual Method","A method emphasizing listening and speaking practice, repetition, drills, habit formation, and controlled patterns.","Students repeat and substitute words in a sentence pattern.",3],["Blended Learning","Learning that combines face-to-face instruction with online or digital learning.","Students learn in class and complete an online activity.",3],["Collaborative Learning","Learning through joint effort, discussion, and shared construction of knowledge.","Students co-write and revise a short paragraph.",3],["Communicative Language Teaching","An approach that prioritizes meaningful communication and communicative competence.","Students practice English through information-gap tasks and role-plays.",3],["Content-Based Instruction","Teaching language through meaningful subject matter or content.","Students learn English while studying a science topic.",3],["Cooperative Learning","Structured learning in which students work together toward shared learning goals.","Small groups solve a problem and each member has a role.",3],["Differentiated Instruction","Adapting teaching, tasks, materials, or assessment to learners' different needs and levels.","A teacher provides easier and more challenging reading tasks.",3],["Direct Method","A method that teaches the target language directly, emphasizes speaking and listening, and generally avoids translation.","The teacher explains a new word using objects or pictures rather than Khmer.",3],["Eclectic Approach","An approach that selects useful techniques from different methods according to learners, goals, and context.","A teacher may combine communicative activities with explicit grammar teaching.",3],["Grammar-Translation Method","A method emphasizing grammar rules, translation, reading, and written exercises, with less emphasis on spontaneous speaking.","Students translate sentences between English and Khmer.",3],["Inquiry-Based Learning","Learning through asking questions, investigating evidence, and developing explanations.","Students investigate why plants grow differently in two places.",3],["Interactive Learning","Learning that emphasizes meaningful interaction among students, teachers, materials, and tasks.","Students discuss and negotiate answers rather than only listen to lectures.",3],["Learner-Centered Instruction","Teaching that gives significant attention to learners' needs, participation, choices, and active learning.","Students work on tasks and the teacher acts as a facilitator.",3],["Method","A systematic plan for teaching based on a particular view of language and learning.","The Grammar-Translation Method is a specific teaching method.",3],["Notional-Functional Syllabus","A syllabus organized around meanings and communicative functions rather than only grammatical structures.","Units may focus on asking for directions, making requests, or expressing ability.",3],["Pedagogy","The theory and practice of teaching, especially how teaching and learning should be organized.","A teacher uses learner-centered pedagogy.",3],["Problem-Based Learning","Learning organized around investigating and solving a meaningful problem.","Students identify causes of poor attendance and propose solutions.",3],["Project-Based Learning","Learning organized around a sustained project that produces a meaningful outcome.","Students create an English-language community project.",3],["Student-Centered Learning","Learning that emphasizes learners' active participation, needs, choices, and responsibility.","Students discuss and solve tasks while the teacher facilitates.",3],["Task-Based Language Teaching","An approach in which learners use language to complete meaningful tasks, with communication central to the lesson.","Students plan a trip using English and then present their plan.",3],["Teaching Approach","A general set of beliefs about language, learning, and teaching.","A communicative approach treats language as communication.",3],["Teaching Method","A systematic plan for teaching based on a particular view of language and learning.","The Direct Method is a teaching method.",3],["Technique","A specific classroom activity or procedure used to implement teaching.","A role-play is a classroom technique.",3],["Andragogy","The theory and practice of teaching adult learners.","Adult education often draws on andragogical principles.",2],["Cognitive Code Learning","An approach emphasizing conscious understanding of language rules and mental processes rather than habit formation alone.","Students analyze why a grammatical form is used.",2],["Experiential Learning","Learning through direct experience followed by reflection.","Students conduct a real survey and reflect on the results.",2],["Natural Approach","An approach emphasizing comprehensible input, low anxiety, and gradual development of communication before demanding accurate production.","Beginners receive understandable English and are not forced to speak immediately.",2],["Reflective Learning","Learning that involves examining one's own experience, decisions, and progress.","A student reflects on why a speaking task was difficult.",2],["Teacher-Centered Learning","An approach in which the teacher controls much of the content, explanation, pace, and classroom activity.","The teacher lectures while students mainly listen and take notes.",2],["Total Physical Response","A method linking language with physical movement, especially useful for beginning learners.","The teacher says 'Stand up' and students perform the action.",2],["Community Language Learning","A learner-supportive approach in which the teacher acts as a counselor and learners collaborate in producing language.","The teacher helps learners express ideas they want to communicate.",1],["Gouin Series Method","An early method using sequences of actions and language to connect language with physical experience.","Learners learn a sequence such as 'I open the door, I walk into the room...'.",1],["Silent Way","A method in which the teacher minimizes speech and uses materials to encourage learners to discover and produce language.","The teacher uses colored rods and gestures while students produce the language.",1],["Suggestopedia","A method associated with relaxed learning environments, music, positive suggestion, and reduced learner anxiety.","Students may work with language in a comfortable, low-stress setting.",1],["Whole Language Education","An approach that treats language as an integrated whole and emphasizes meaningful reading and writing.","Students learn language through authentic texts and meaningful activities.",1],["PPP","A lesson model with three stages: Presentation, Practice, Production.","Teach 'used to' with pictures, drill it, then students write about childhood habits.",3],["PRS","A teaching sequence: Presentation, Restricted practice, Structured/free production.","Often presented as a variant of PPP in teacher training.",2],["Presentation","The stage in which new language is introduced and its meaning, form and use are made clear.","The teacher shows a timeline to introduce the present perfect.",2],["Practice","The stage in which learners use the new language under teacher control.","Choral drilling of a new sentence pattern.",2],["Production","The stage in which learners use the language freely and communicatively.","Students interview each other about past experiences.",2],["Controlled Practice","Practice in which the language and the response are strictly limited by the teacher; accuracy is the aim.","Gap-fill exercise with one right answer.",3],["Guided Practice","Practice that gives support and some choice, between controlled and free practice.","Students complete a dialogue using prompts.",3],["Free Practice","Practice in which learners choose their own language to complete a communicative task; fluency is the aim.","A group discussion or a role play.",3]]},{"id":"c8","s":"Classroom Practice","n":"Classroom Practice","l":2,"ic":"🏫","t":[["Classroom Climate","The overall emotional, social, and interpersonal atmosphere of a classroom.","A respectful classroom climate encourages participation.",3],["Classroom Interaction","The patterns of communication and participation among teacher and students.","Teacher questioning and student responses form classroom interaction.",3],["Classroom Management","The organization of classroom behavior, routines, time, space, and interaction to support learning.","A teacher establishes clear rules and transitions.",3],["Corrective Feedback","Information provided to a learner about the accuracy or appropriateness of their language.","Teacher: 'He go?' Student: 'He goes.'",3],["Elicitation","A teaching technique used to encourage learners to produce information or language rather than simply receive it.","The teacher shows a picture and asks, 'What is this?'",3],["Feedback","Information provided to learners about their performance to support improvement.","The teacher tells a student what was done well and what to improve.",3],["Group Work","An activity in which several students work together on a shared task.","Four students solve a problem together.",3],["Inclusive Education","An approach that ensures learners with different abilities, backgrounds, and needs learn together with appropriate support.","A school adapts activities so students with disabilities can participate.",3],["Learner Engagement","The extent to which learners participate behaviorally, emotionally, and cognitively in learning.","Students actively discuss and persist with a challenging task.",3],["Mixed-Ability Class","A class containing learners with different levels of ability or proficiency.","One English class contains beginner and stronger students.",3],["Open-Ended Question","A question that allows multiple possible responses rather than one fixed answer.","Why do you think reading is important?",3],["Pair Work","An activity in which two students work together on a learning task.","Two students practice a dialogue.",3],["Peer Feedback","Feedback provided by one learner to another.","Students exchange essays and give suggestions.",3],["Questioning","The use of questions to elicit information, check understanding, stimulate thinking, or guide learning.","A teacher asks 'Why do you think so?' to promote reasoning.",3],["Student Agency","A learner's ability to make choices, take initiative, and influence their own learning.","Students choose a project topic and plan how to present it.",3],["Student Engagement","The degree to which learners are behaviorally, emotionally, and cognitively involved in learning.","Students actively participate and persist with a task.",3],["Student Talk","The language produced by students during classroom activities.","Students discuss answers in pairs.",3],["Teacher Talk","The language produced by the teacher during classroom instruction.","Teacher explanations, questions, instructions, and feedback are teacher talk.",3],["Wait Time","The deliberate pause a teacher gives after asking a question before selecting a response.","The teacher waits five seconds so more students can think.",3],["Closed Question","A question with a limited or predetermined set of answers.","Did you finish your homework?",2],["Needs-Based Teaching","Teaching adapted to learners' identified goals, abilities, and needs.","A teacher emphasizes speaking because learners need English for customer service.",2],["Peer Teaching","A learning activity in which students teach or explain content to classmates.","Pairs take turns explaining vocabulary.",2],["Concept Checking","Asking short questions to check that learners understand the meaning of new language.","'Is it happening now?' to check the present continuous.",3],["Comprehension Checking","Checking that learners understand a text, instruction or explanation.","Asking students to explain the instructions back.",2],["Error Correction","Techniques a teacher uses to show learners their mistakes and help them correct them.","Recasting a mistake, using fingers to show word order, or peer correction.",3],["Modeling","Showing learners how to do a task or say language by demonstrating a good example.","The teacher reads a sentence with correct stress before students repeat it.",2]]},{"id":"c18","s":"Language Skills","n":"Language Skills & Strategies","l":2,"ic":"👀","t":[["Skimming","Reading quickly to get the general idea of a text.","Glancing over headings and the first lines to find what an article is about.",3],["Scanning","Reading quickly to find a specific piece of information.","Looking through a timetable for the 9:00 train.",3],["Intensive Reading","Careful reading of a short text to understand details, language and meaning.","Studying a short passage line by line in class.",2],["Extensive Reading","Reading longer texts for pleasure and general understanding, often outside class.","Reading graded readers or a novel for fun.",3],["Bottom-Up Processing","Understanding a text by building meaning from small units: sounds, letters, words and sentences.","Decoding each word to understand a sentence.",3],["Top-Down Processing","Understanding a text by using background knowledge and expectations to predict meaning.","Guessing the topic of a news story from its headline.",3],["Interactive Processing","Combining bottom-up and top-down processing, using both language details and background knowledge.","A reader uses vocabulary clues and topic knowledge together.",2]]},{"id":"c14","s":"Assessment","n":"Assessment & Evaluation","l":3,"ic":"📝","t":[["Achievement Test","A test designed to measure what learners have learned from a particular course or program.","A final test based on Units 1–6.",3],["Assessment","The systematic process of gathering information about learning or performance.","A teacher uses a quiz and observation to assess learning.",3],["Assessment for Learning","The use of assessment evidence primarily to improve learning and instruction.","A teacher uses quiz results to reteach a difficult concept.",3],["Assessment Literacy","Teachers' knowledge and skills for designing, interpreting, and using assessment appropriately.","A teacher chooses a valid rubric for a speaking task.",3],["Authenticity","The extent to which assessment tasks resemble meaningful real-world language use.","Students write an actual email rather than only choose grammar answers.",3],["Continuous Assessment","Assessment carried out regularly throughout a course rather than only in a final examination.","Homework, quizzes, projects, and participation contribute to the final grade.",3],["Criterion-Referenced Assessment","Assessment interpreted against defined learning criteria or standards rather than against other test takers.","A student passes after meeting 80% of stated criteria.",3],["Diagnostic Assessment","Assessment used to identify learners' strengths, weaknesses, and needs before or during instruction.","A pre-test identifies students' grammar difficulties.",3],["Evaluation","The process of making a judgment about the quality, value, or effectiveness of learning, teaching, or a program.","A school evaluates whether a new program improved reading outcomes.",3],["Formative Assessment","Assessment conducted during learning to provide information that improves ongoing teaching and learning.","An exit ticket helps the teacher plan tomorrow's lesson.",3],["Formative Feedback","Feedback provided during learning to help learners improve before final evaluation.","A teacher comments on a draft before the final essay.",3],["Peer Assessment","Assessment in which learners evaluate one another's work.","Students use a rubric to assess classmates' presentations.",3],["Placement Test","A test used to determine an appropriate level or class for a learner.","A language school tests students before assigning classes.",3],["Portfolio","A purposeful collection of learner work used to demonstrate progress or achievement.","A student keeps drafts and final versions of essays.",3],["Proficiency Test","A test measuring general ability in a language rather than achievement of a specific course.","An English proficiency examination for university admission.",3],["Reliability","The consistency or stability of assessment results.","A reliable test gives similar results under similar conditions.",3],["Rubric","A scoring guide containing criteria and performance levels for evaluating work.","An essay rubric scores organization, grammar, vocabulary, and ideas.",3],["Self-Assessment","Assessment in which learners judge their own learning or performance.","A student rates their speaking confidence using a checklist.",3],["Summative Assessment","Assessment conducted at the end of a period of learning to judge achievement.","A final examination at the end of a course.",3],["Validity","The degree to which an assessment measures what it is intended to measure.","A speaking test should actually assess speaking ability.",3],["Washback","The effect that testing and assessment have on teaching and learning.","A high-stakes grammar exam may cause teachers to focus heavily on grammar drills.",3],["Norm-Referenced Assessment","Assessment interpreted by comparing a learner's performance with that of a reference group.","A student's score is reported by percentile rank.",2],["Criterion-Referenced Test","A test that measures performance against a fixed standard or set of objectives, not against other students.","A driving test: everyone passes if the criteria are met.",3],["Norm-Referenced Test","A test that compares each student's score with the scores of other students.","A national exam that ranks students by percentile.",3],["Performance Assessment","Assessment that asks learners to show what they can do by carrying out a real task.","A presentation or role play marked with a rubric.",2],["Authentic Assessment","Assessment that uses real-world tasks that match what learners will do outside class.","Writing an email to a real customer.",3],["Alternative Assessment","Assessment that goes beyond traditional tests, such as portfolios, projects and self-assessment.","A learner's writing portfolio.",2],["Progress Test","A test given during a course to check how much learners have learned from recent lessons.","A short unit test after Unit 3.",2],["Diagnostic Test","A test used to find a learner's strengths and weaknesses before teaching.","A test at the start of the course on verb tenses.",2],["Aptitude Test","A test that predicts how well a person is likely to learn a language.","A test of sound discrimination and memory for new words.",2],["Practicality","The quality of a test being easy to design, give, mark and afford with the time and resources available.","A short multiple-choice test that can be machine-scored.",3],["Discrimination","The ability of a test item to separate stronger learners from weaker ones.","An item that most high scorers answer correctly and most low scorers get wrong.",2],["Test Bias","An unfair advantage or disadvantage in a test for some group of learners, unrelated to the skill being tested.","A reading passage about a sport that only some students know.",2]]},{"id":"c15","s":"Education Theory & Curriculum","n":"Education Theory & Curriculum","l":3,"ic":"🏛️","t":[["Behaviorism","A learning theory emphasizing observable behavior, stimulus-response relationships, practice, and reinforcement.","Repetition and reinforcement are used to establish language habits.",3],["Bloom's Taxonomy","A framework for classifying cognitive learning objectives from lower to higher levels of thinking.","Remember, understand, apply, analyze, evaluate, create.",3],["Cognitivism","A learning perspective emphasizing mental processes such as attention, memory, processing, and problem-solving.","A teacher helps students organize new vocabulary in meaningful categories.",3],["Competency","An integrated ability to apply knowledge, skills, and attitudes effectively in a context.","A competent teacher can plan and deliver an effective lesson.",3],["Constructivism","A view that learners actively construct knowledge through experience and interaction.","Students build understanding by solving a problem and discussing it.",3],["Creativity","The ability to generate original or useful ideas, solutions, or products.","Students create a new dialogue using target vocabulary.",3],["Critical Thinking","The ability to analyze information, evaluate evidence, and make reasoned judgments.","Students compare two arguments and identify which has stronger evidence.",3],["Curriculum","The broader planned educational program, including goals, content, learning experiences, assessment, and sometimes policies.","A national curriculum specifies expected learning outcomes.",3],["Higher-Order Thinking","Thinking that involves analysis, evaluation, creation, and other complex cognitive processes beyond simple recall.","Students evaluate evidence and design a solution.",3],["Learning Objective","A specific statement of what learners are expected to learn or do.","Students will identify three causes of pollution.",3],["Learning Outcome","A statement of what learners should be able to demonstrate as a result of learning.","By the end of the lesson, students can make a polite request.",3],["Needs Analysis","The systematic process of identifying learners' needs, goals, current abilities, and learning gaps.","A teacher surveys students to identify their English needs.",3],["Positive Reinforcement","Adding a desirable consequence to increase a behavior.","Giving praise after a student completes a task.",3],["Problem-Solving","The process of identifying a problem, considering options, and developing and evaluating solutions.","Students identify causes of low participation and propose solutions.",3],["Reinforcement","A consequence that increases the likelihood that a behavior will occur again.","Praise after successful participation can encourage future participation.",3],["Social Constructivism","A view emphasizing that learning is constructed through social interaction and support from others.","Students learn through collaborative problem-solving.",3],["Syllabus","A more specific outline of the content, topics, sequence, and requirements of a course.","An English syllabus lists units and assessment tasks.",3],["Hidden Curriculum","Unintended learning about values, behaviors, norms, and social expectations conveyed through school practices.","Students may learn punctuality and hierarchy through school routines.",2],["Negative Reinforcement","Removing an unpleasant condition to increase a behavior; it is not the same as punishment.","Removing an extra practice requirement when students consistently meet a target.",2],["Punishment","A consequence intended to reduce an undesirable behavior.","A school consequence is given for repeated rule violations.",2]]},{"id":"c16","s":"Research & Professional Practice","n":"Research & Professional Practice","l":3,"ic":"🔍","t":[["Action Research","Systematic inquiry conducted by practitioners to improve their own practice.","A teacher tests a new reading strategy, collects evidence, and reflects on the results.",3],["Evidence-Based Practice","Professional practice informed by credible research evidence together with professional expertise and context.","A teacher selects a reading strategy supported by research.",3],["Interview","A method of collecting information through structured or semi-structured questions and responses.","A researcher interviews English teachers.",3],["Observation","A research or assessment method involving systematic watching and recording of behavior or events.","A teacher observes student participation using a checklist.",3],["Pedagogical Content Knowledge","The knowledge of how to teach particular subject content effectively to particular learners.","Knowing how to explain English tense to Cambodian beginners.",3],["Professional Development","Ongoing learning and training that improve a teacher's professional knowledge and practice.","A teacher attends a workshop on assessment.",3],["Professional Ethics","Principles and standards guiding responsible, fair, respectful, and professional conduct.","A teacher protects student confidentiality and treats learners fairly.",3],["Questionnaire","A structured set of written questions used to collect information from respondents.","Students complete a questionnaire about learning preferences.",3],["Reflective Teaching","A process in which teachers systematically examine their teaching decisions and outcomes to improve practice.","A teacher reflects after a lesson and changes the next lesson plan.",3],["Triangulation","Using multiple data sources, methods, researchers, or perspectives to strengthen the credibility of findings.","Combining observations, interviews, and test data.",3],["Case Study","An in-depth investigation of a particular person, group, class, institution, or case.","A researcher studies one rural school in depth.",2],["Mixed-Methods Research","Research combining qualitative and quantitative approaches.","A study combines test scores with student interviews.",2],["Qualitative Research","Research focused mainly on non-numerical data such as interviews, observations, and texts.","Interviewing teachers about classroom challenges.",2],["Quantitative Research","Research using numerical data and statistical analysis.","Comparing test scores before and after an intervention.",2],["Teacher Efficacy","A teacher's belief in their ability to influence student learning effectively.","A teacher believes they can help struggling students improve.",2]]},{"id":"c17","s":"Key Education Concepts","n":"Key Education Concepts","l":3,"ic":"🌍","t":[["21st-Century Skills","Skills needed for modern learning and work, commonly including communication, collaboration, critical thinking, creativity, and digital skills.","Students collaborate on a project and present their findings.",3],["Accessibility","The extent to which environments, materials, services, and learning opportunities can be used by people with different needs and abilities.","Providing accessible learning materials for students with disabilities.",3],["Digital Literacy","The ability to find, evaluate, create, communicate, and use information effectively through digital technologies.","Students evaluate whether an online source is reliable.",3],["Education Quality","The degree to which education effectively supports meaningful learning and development.","Quality education includes effective teaching, relevant content, and supportive learning environments.",3],["Equality","Providing the same rights, opportunities, or treatment to everyone.","All students receive access to the same school library.",3],["Equity","Fairness in access, support, opportunities, and outcomes, recognizing that different learners may need different support.","Providing additional support to learners facing greater barriers.",3],["Inclusive Classroom","A classroom designed to enable learners with diverse abilities, backgrounds, and needs to participate meaningfully.","The teacher uses multiple ways for students to demonstrate learning.",3],["Lifelong Learning","The continuous development of knowledge and skills throughout life.","A teacher continues learning through professional development.",3],["Sustainable Development","Development that meets present needs while protecting the ability of future generations to meet their needs.","Education supports sustainable development through environmental awareness and responsible action.",3],["Global Citizenship","Awareness of global interdependence and the knowledge, skills, values, and attitudes needed to participate responsibly in a global community.","Students learn about global issues and respect different cultures.",2]]}];
